<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0D14">
<meta name="description" content="Suivi de prise de masse à domicile : programme 52 semaines, recettes, courses et analyse.">
<link rel="manifest" href="manifest.webmanifest">
<title>Charge — prise de masse 52 semaines</title>
<style>
/* ============================================================
   PALETTE — une nuit de livraison : bitume mouillé, lampadaires
   sodium, feu vert, phare de vélo.
   ============================================================ */
:root{
  --nuit-0:#0A0D14; --nuit-1:#0F131C; --nuit-2:#161B26; --nuit-3:#1E2532; --nuit-4:#252E3D;
  --bord:#2A3340; --bord-2:#3A4553;
  --txt:#EDF1F6; --txt-2:#96A2B3; --txt-3:#626E7E;

  --amb-1:#FFC46B; --amb-2:#FFAE3D; --amb-3:#F08519; --amb-4:#B85F0C; --amb-o:rgba(255,174,61,.13);
  --vrt-1:#7EE8A8; --vrt-2:#4ADE80; --vrt-3:#22C55E; --vrt-4:#15803D; --vrt-o:rgba(74,222,128,.12);
  --blu-1:#A5DDFC; --blu-2:#7DD3FC; --blu-3:#38BDF8; --blu-4:#0284C7; --blu-o:rgba(56,189,248,.12);
  --vio-1:#D5C8FF; --vio-2:#B9A4FB; --vio-3:#8B5CF6; --vio-4:#6D28D9; --vio-o:rgba(139,92,246,.13);
  --ros-1:#FFA8B0; --ros-2:#FB7185; --ros-3:#E11D48; --ros-o:rgba(251,113,133,.12);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-s:9px;
  --pad:16px;
  --nav-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--nuit-0);
  background-image:
    radial-gradient(1100px 480px at 82% -12%, rgba(255,174,61,.075), transparent 62%),
    radial-gradient(820px 420px at 8% 102%, rgba(56,189,248,.06), transparent 60%);
  background-attachment:fixed;
  color:var(--txt); font-family:var(--sans);
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;padding:0 var(--pad)}

/* ---------- Typographie ---------- */
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.022em;line-height:1.2}
h1{font-size:25px} h2{font-size:19px} h3{font-size:15.5px} h4{font-size:13.5px}
p{margin:0 0 10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.eyebrow{
  font-family:var(--mono);font-size:9.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.15em;color:var(--txt-3);
}
.sub{color:var(--txt-2);font-size:13px;line-height:1.5}
.mini{color:var(--txt-3);font-size:11.5px;line-height:1.45}
.amb{color:var(--amb-2)} .vrt{color:var(--vrt-2)} .blu{color:var(--blu-2)}
.vio{color:var(--vio-2)} .ros{color:var(--ros-2)} .t2{color:var(--txt-2)} .t3{color:var(--txt-3)}

/* ---------- En-tête ---------- */
header{padding:calc(env(safe-area-inset-top) + 18px) 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.marque{display:flex;flex-direction:column;gap:3px}
.marque .nom{font-size:16px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.pastille{width:9px;height:9px;border-radius:3px;background:linear-gradient(150deg,var(--amb-1),var(--amb-4));box-shadow:0 0 11px var(--amb-o)}
.btn-reglages{
  background:var(--nuit-2);border:1px solid var(--bord);color:var(--txt-2);
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px
}
.btn-reglages:active{background:var(--nuit-3)}

/* ---------- Cartes ---------- */
.carte{
  background:linear-gradient(180deg,var(--nuit-2),var(--nuit-1));
  border:1px solid var(--bord); border-radius:var(--r);
  padding:15px; margin-bottom:12px; position:relative; overflow:hidden;
}
.carte::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--bord)}
.carte.amber::before{background:linear-gradient(90deg,var(--amb-3),var(--amb-1),transparent 88%)}
.carte.green::before{background:linear-gradient(90deg,var(--vrt-4),var(--vrt-2),transparent 88%)}
.carte.blue::before {background:linear-gradient(90deg,var(--blu-4),var(--blu-2),transparent 88%)}
.carte.violet::before{background:linear-gradient(90deg,var(--vio-4),var(--vio-2),transparent 88%)}
.carte.rose::before{background:linear-gradient(90deg,var(--ros-3),var(--ros-1),transparent 88%)}
.carte-tete{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}

/* ---------- Boutons ---------- */
.btn{
  font-family:var(--sans);font-size:14px;font-weight:650;
  background:var(--nuit-3);color:var(--txt);
  border:1px solid var(--bord-2);border-radius:11px;
  padding:11px 15px;cursor:pointer;transition:transform .06s,background .13s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:active{transform:scale(.975)}
.btn.plein{background:linear-gradient(160deg,var(--amb-2),var(--amb-4));border-color:var(--amb-3);color:#1A1206;font-weight:750}
.btn.vert{background:linear-gradient(160deg,var(--vrt-2),var(--vrt-4));border-color:var(--vrt-3);color:#04180C;font-weight:750}
.btn.bleu{background:linear-gradient(160deg,var(--blu-3),var(--blu-4));border-color:var(--blu-3);color:#04121C;font-weight:750}
.btn.large{width:100%}
.btn.mini{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.fant{background:transparent;border-color:var(--bord)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-rangee{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Champs ---------- */
input,select,textarea{
  font-family:var(--mono);font-size:15px;
  background:var(--nuit-0);color:var(--txt);
  border:1px solid var(--bord);border-radius:10px;padding:10px 11px;width:100%;
}
input:focus,select,textarea:focus{outline:2px solid var(--amb-3);outline-offset:1px}
select{font-family:var(--sans);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);background-position:calc(100% - 16px) 51%,calc(100% - 11px) 51%;background-size:5px 5px;background-repeat:no-repeat}
label{display:block;margin-bottom:14px}
label>span{display:block;margin-bottom:5px;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--txt-3)}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grille3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

/* ---------- Anneau de calories ---------- */
.anneau-bloc{display:flex;align-items:center;gap:16px}
.anneau{
  --p:0; --c1:var(--amb-2); --c2:var(--amb-4);
  width:106px;height:106px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from -90deg, var(--c1) 0turn, var(--c2) calc(var(--p)*1turn), var(--nuit-3) calc(var(--p)*1turn) 1turn);
  display:grid;place-items:center;
  transition:--p .5s;
}
.anneau::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--nuit-1)}
.anneau-txt{position:relative;z-index:1;text-align:center;line-height:1.05}
.anneau-txt .g{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.04em}
.anneau-txt .p{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--txt-3);margin-top:3px}

/* ---------- Barres de macros ---------- */
.macro{margin-bottom:9px}
.macro:last-child{margin-bottom:0}
.macro-tete{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.macro-tete .n{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--txt-3)}
.macro-tete .v{font-family:var(--mono);font-size:12px;font-weight:600}
.jauge{height:5px;border-radius:3px;background:var(--nuit-3);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:3px;transition:width .4s}

/* ---------- La barre : 52 semaines ---------- */
.barre-an{display:flex;flex-direction:column-reverse;gap:2px;padding:4px 0}
.sem{
  height:8px;border-radius:2px;position:relative;
  background:var(--nuit-3);border:1px solid transparent;
  transition:width .35s, background .25s;
}
.sem.futur{background:transparent;border:1px dashed var(--bord);opacity:.45}
.sem.vide{background:var(--nuit-3)}
.sem.partiel{background:linear-gradient(90deg,var(--amb-4),var(--amb-2))}
.sem.plein{background:linear-gradient(90deg,var(--vrt-4),var(--vrt-2))}
.sem.deload{background:linear-gradient(90deg,var(--blu-4),var(--blu-2))}
.sem.now{box-shadow:0 0 0 1px var(--amb-2),0 0 13px var(--amb-o)}
.barre-compacte{display:flex;gap:1.5px;align-items:flex-end;height:34px}
.barre-compacte i{flex:1;border-radius:1.5px;background:var(--nuit-3);min-height:4px}
.barre-legende{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px}
.lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--txt-3)}
.lg b{width:9px;height:9px;border-radius:2px;display:block}

/* ---------- Listes ---------- */
.ligne{
  display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--bord);cursor:pointer;
}
.ligne:last-child{border-bottom:none}
.ligne .corps{flex:1;min-width:0}
.ligne .titre{font-weight:640;font-size:14px;letter-spacing:-.012em}
.ligne .det{font-size:11.5px;color:var(--txt-3);margin-top:2px;font-family:var(--mono)}
.puce{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700}
.puce.amber{background:var(--amb-o);color:var(--amb-2)}
.puce.green{background:var(--vrt-o);color:var(--vrt-2)}
.puce.blue{background:var(--blu-o);color:var(--blu-2)}
.puce.violet{background:var(--vio-o);color:var(--vio-2)}
.puce.rose{background:var(--ros-o);color:var(--ros-2)}

.coche{
  width:25px;height:25px;border-radius:8px;flex:none;
  border:1.5px solid var(--bord-2);display:grid;place-items:center;
  font-size:13px;color:transparent;transition:.15s;background:var(--nuit-0)
}
.coche.on{background:linear-gradient(160deg,var(--vrt-2),var(--vrt-4));border-color:var(--vrt-3);color:#04180C}
.fait .titre{color:var(--txt-3);text-decoration:line-through;text-decoration-color:var(--vrt-4)}

/* ---------- Chips / segments ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:var(--nuit-2);border:1px solid var(--bord);color:var(--txt-2);cursor:pointer;white-space:nowrap
}
.chip.on{background:var(--amb-o);border-color:var(--amb-3);color:var(--amb-1)}
.chip.on.v{background:var(--vio-o);border-color:var(--vio-3);color:var(--vio-1)}

/* ---------- Constats d'analyse ---------- */
.constat{border-left:3px solid var(--bord);padding:12px 0 12px 13px;margin-bottom:13px}
.constat:last-child{margin-bottom:0}
.constat.ok{border-color:var(--vrt-3)}
.constat.action{border-color:var(--amb-3)}
.constat.alerte{border-color:var(--ros-3)}
.constat.info{border-color:var(--blu-3)}
.constat h4{margin-bottom:5px;font-size:14px}
.constat p{font-size:13px;color:var(--txt-2);margin:0;line-height:1.55}
.constat .btn{margin-top:10px}

/* ---------- Exercice en séance ---------- */
.serie{
  display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:7px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--nuit-3)
}
.serie:last-of-type{border-bottom:none}
.serie .idx{font-family:var(--mono);font-size:11px;color:var(--txt-3);text-align:center}
.serie input{padding:8px 6px;text-align:center;font-size:14px;border-radius:8px}
.serie .ok{
  width:32px;height:32px;border-radius:9px;border:1.5px solid var(--bord-2);
  background:var(--nuit-0);display:grid;place-items:center;color:transparent;font-size:14px;cursor:pointer
}
.serie .ok.on{background:linear-gradient(160deg,var(--vrt-2),var(--vrt-4));border-color:var(--vrt-3);color:#04180C}
.entete-serie{display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:7px;margin-bottom:3px}
.entete-serie span{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--txt-3);text-align:center}

/* ---------- Minuteur plein écran ---------- */
#minuteur{
  position:fixed;inset:0;z-index:60;background:rgba(8,11,17,.975);backdrop-filter:blur(9px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:26px
}
#minuteur.on{display:flex}
.cadran{
  --p:1;width:min(70vw,270px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(from -90deg,var(--amb-2) 0turn,var(--amb-4) calc(var(--p)*1turn),var(--nuit-2) calc(var(--p)*1turn) 1turn);
}
.cadran::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--nuit-0)}
.cadran-txt{position:relative;z-index:1;text-align:center}
.cadran-txt .t{font-family:var(--mono);font-size:54px;font-weight:700;letter-spacing:-.05em;line-height:1}
.cadran-txt .l{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--txt-3);margin-top:7px}
.tempo-bulle{
  width:min(56vw,210px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--amb-3);transition:transform .1s linear;
  font-family:var(--mono);font-size:16px;font-weight:700;color:var(--amb-1);text-transform:uppercase;letter-spacing:.1em
}

/* ---------- Feuille modale ---------- */
#feuille{position:fixed;inset:0;z-index:50;display:none}
#feuille.on{display:block}
.voile{position:absolute;inset:0;background:rgba(5,7,11,.72);backdrop-filter:blur(3px)}
.panneau{
  position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;
  background:var(--nuit-1);border-top:1px solid var(--bord);
  border-radius:20px 20px 0 0;padding:18px var(--pad) calc(26px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
  animation:monte .24s cubic-bezier(.22,1,.36,1);
}
@keyframes monte{from{transform:translateY(100%)}to{transform:translateY(0)}}
.poignee{width:34px;height:4px;border-radius:2px;background:var(--bord-2);margin:0 auto 15px}

/* ---------- Navigation ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(12,16,23,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--bord);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
  max-width:560px;margin:0 auto;
}
nav button{
  flex:1;background:none;border:none;color:var(--txt-3);cursor:pointer;
  padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;
  border-top:2px solid transparent;margin-top:-1px;transition:color .15s
}
nav button svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--amb-2);border-top-color:var(--amb-2)}

/* ---------- Divers ---------- */
.vide-etat{text-align:center;padding:34px 16px;color:var(--txt-3)}
.vide-etat .g{font-size:30px;margin-bottom:9px;opacity:.6}
.pillule{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600
}
.pillule.amber{background:var(--amb-o);color:var(--amb-2)}
.pillule.green{background:var(--vrt-o);color:var(--vrt-2)}
.pillule.blue{background:var(--blu-o);color:var(--blu-2)}
.pillule.violet{background:var(--vio-o);color:var(--vio-2)}
.pillule.rose{background:var(--ros-o);color:var(--ros-2)}
.pillule.gris{background:var(--nuit-3);color:var(--txt-3)}
.sep{height:1px;background:var(--bord);margin:14px 0}
.notes{list-style:none;padding:0;margin:0}
.notes li{position:relative;padding-left:17px;margin-bottom:7px;font-size:13px;color:var(--txt-2);line-height:1.5}
.notes li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:2px;background:var(--amb-3)}
.notes.ros li::before{background:var(--ros-3)}
.notes.vrt li::before{background:var(--vrt-3)}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:70;
  background:var(--nuit-3);border:1px solid var(--bord-2);border-radius:11px;
  padding:10px 16px;font-size:13px;font-weight:600;
  box-shadow:0 8px 26px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* ---------- Figures d'exercice ---------- */
.fig{width:100%;height:auto;display:block}
.f-sol{stroke:var(--bord-2);stroke-width:1;stroke-linecap:round}
.f-prop{fill:var(--nuit-4);stroke:var(--bord-2);stroke-width:.7}
.f-prop-l{stroke:var(--bord-2);stroke-width:1.5;stroke-linecap:round}
.f-loin{opacity:.3}
.f-b2,.f-j2{fill:none;stroke:var(--txt-2);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.f-torse{stroke:var(--amb-2);stroke-width:5.4;stroke-linecap:round}
.f-cou{stroke:var(--amb-2);stroke-width:3.4;stroke-linecap:round}
.f-b1,.f-j1{fill:none;stroke:var(--amb-2);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.f-tete{fill:var(--amb-1)}
.fig-boite{
  border-radius:12px;padding:9px 4px;overflow:hidden;position:relative;
  background:radial-gradient(78% 96% at 50% 34%, var(--nuit-3), var(--nuit-0) 76%);
  border:1px solid var(--bord);
}
.fig-boite.mini{padding:3px 0;border-radius:9px;width:74px;flex:none}
.fig-boite .etiq{position:absolute;top:7px;left:9px;font-family:var(--mono);font-size:8.5px;
  text-transform:uppercase;letter-spacing:.14em;color:var(--txt-3)}
.fg-green .f-torse,.fg-green .f-cou,.fg-green .f-b1,.fg-green .f-j1{stroke:var(--vrt-2)}
.fg-green .f-tete{fill:var(--vrt-1)}
.fg-blue .f-torse,.fg-blue .f-cou,.fg-blue .f-b1,.fg-blue .f-j1{stroke:var(--blu-2)}
.fg-blue .f-tete{fill:var(--blu-1)}
.fg-violet .f-torse,.fg-violet .f-cou,.fg-violet .f-b1,.fg-violet .f-j1{stroke:var(--vio-2)}
.fg-violet .f-tete{fill:var(--vio-1)}
.galerie{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.galerie .case{cursor:pointer}
.galerie .nom{font-size:10px;line-height:1.25;font-weight:600;color:var(--txt-2);
  margin-top:5px;text-align:center;min-height:25px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--amb-2);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="marque">
      <div class="eyebrow" id="hdr-sem">Semaine 1 · Bloc 1</div>
      <div class="nom"><span class="pastille"></span>Charge</div>
    </div>
    <button class="btn-reglages" onclick="ouvrirReglages()" aria-label="Réglages">⚙</button>
  </header>
  <main id="vue"></main>
</div>

<nav id="nav"></nav>

/* ---------- Rendu ---------- */
const PT = p => p[0].toFixed(1)+","+p[1].toFixed(1);
function formes(liste){
  return (liste||[]).map(f => f.t==="r"
    ? `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="1" class="f-prop"/>`
    : `<line x1="${f.x1}" y1="${f.y1}" x2="${f.x2}" y2="${f.y2}" class="f-prop-l"/>`).join("");
}
function figureSVG(exoId, anim){
  const cle = (typeof figDe === "function" ? figDe(exoId) : FIG_EXO[exoId]);
  const fig = FIGURES[cle];
  if(!fig) return "";
  const A = fig.a, anime = anim && !!fig.b;
  const uid = "f"+Math.random().toString(36).slice(2,8);
  return `<svg class="fig${anime?" fig-anim":""}" ${anime?`data-fig="${cle}" id="${uid}"`:""} viewBox="0 0 100 78" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    ${fig.sol===false?"":'<line x1="4" y1="70" x2="96" y2="70" class="f-sol"/>'}
    <g class="f-props">${formes(fig.pr)}</g>
    <g class="f-mobile">${formes(fig.pa)}</g>
    <g class="f-loin">
      <polyline class="f-b2" points="${PT(A.n)} ${PT(A.e2)} ${PT(A.w2)}"/>
      <polyline class="f-j2" points="${PT(A.p)} ${PT(A.k2)} ${PT(A.a2)}"/>
    </g>
    <line class="f-cou" x1="${PT(A.n).split(",")[0]}" y1="${A.n[1]}" x2="${A.h[0]}" y2="${A.h[1]}"/>
    <line class="f-torse" x1="${A.n[0]}" y1="${A.n[1]}" x2="${A.p[0]}" y2="${A.p[1]}"/>
    <polyline class="f-b1" points="${PT(A.n)} ${PT(A.e)} ${PT(A.w)}"/>
    <polyline class="f-j1" points="${PT(A.p)} ${PT(A.k)} ${PT(A.a)}"/>
    <circle class="f-tete" cx="${A.h[0]}" cy="${A.h[1]}" r="4.6"/>
  </svg>`;
}

/* ---------- Animation ---------- */
let FIG_RAF = null;
const lerp = (a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
const doux  = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

function phaseFig(u){            /* 0→1 : descente, tenue, remontée, pause */
  if(u < .40) return doux(u/.40);
  if(u < .52) return 1;
  if(u < .88) return 1 - doux((u-.52)/.36);
  return 0;
}
function animerFigures(){
  cancelAnimationFrame(FIG_RAF);
  const cibles = [...document.querySelectorAll(".fig-anim")];
  if(!cibles.length) return;
  const t0 = performance.now();
  const boucle = now => {
    const u = ((now - t0) / 3200) % 1, t = phaseFig(u);
    cibles.forEach(svg => {
      const fig = FIGURES[svg.dataset.fig]; if(!fig || !fig.b) return;
      const A = fig.a, B = fig.b, P = {};
      ["h","n","p","e","w","k","a","e2","w2","k2","a2"].forEach(j => P[j] = lerp(A[j], B[j], t));
      const q = s => svg.querySelector(s);
      q(".f-b2").setAttribute("points", `${PT(P.n)} ${PT(P.e2)} ${PT(P.w2)}`);
      q(".f-j2").setAttribute("points", `${PT(P.p)} ${PT(P.k2)} ${PT(P.a2)}`);
      const cou = q(".f-cou");
      cou.setAttribute("x1", P.n[0]); cou.setAttribute("y1", P.n[1]);
      cou.setAttribute("x2", P.h[0]); cou.setAttribute("y2", P.h[1]);
      const to = q(".f-torse");
      to.setAttribute("x1", P.n[0]); to.setAttribute("y1", P.n[1]);
      to.setAttribute("x2", P.p[0]); to.setAttribute("y2", P.p[1]);
      q(".f-b1").setAttribute("points", `${PT(P.n)} ${PT(P.e)} ${PT(P.w)}`);
      q(".f-j1").setAttribute("points", `${PT(P.p)} ${PT(P.k)} ${PT(P.a)}`);
      const te = q(".f-tete");
      te.setAttribute("cx", P.h[0]); te.setAttribute("cy", P.h[1]);
      if(fig.pa && fig.pb){
        const m = q(".f-mobile"); if(m){
          m.innerHTML = formes(fig.pa.map((f,i)=>{
            const g = fig.pb[i] || f;
            return R(f.x+(g.x-f.x)*t, f.y+(g.y-f.y)*t, f.w, f.h);
          }));
        }
      }
    });
    FIG_RAF = requestAnimationFrame(boucle);
  };
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches) FIG_RAF = requestAnimationFrame(boucle);
}
/* ============================================================
   STOCKAGE — localStorage avec repli mémoire
   (le repli sert uniquement à l'aperçu ; une fois le fichier
   téléchargé ou publié, les données persistent normalement)
   ============================================================ */
const Store = {
  _mem:{}, ok:false,
  init(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); this.ok=true; }
          catch(e){ this.ok=false; } return this.ok; },
  get(k){ try{ return this.ok ? localStorage.getItem(k) : (this._mem[k] ?? null); }
          catch(e){ return this._mem[k] ?? null; } },
  set(k,v){ try{ if(this.ok) localStorage.setItem(k,v); else this._mem[k]=v; }
            catch(e){ this._mem[k]=v; } },
  del(k){ try{ if(this.ok) localStorage.removeItem(k); else delete this._mem[k]; }catch(e){} }
};

/* ============================================================
   DATES
   ============================================================ */
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }
function aujourdhui(){ return iso(new Date()); }
function dPlus(dateStr,n){ const d=new Date(dateStr+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function joursEntre(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); }
function jourSemaine(dateStr){ return new Date(dateStr+"T12:00:00").getDay(); }
const JOURS_FR = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MOIS_FR  = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function dateCourte(dateStr){ const d=new Date(dateStr+"T12:00:00"); return d.getDate()+" "+MOIS_FR[d.getMonth()]; }

function numSemaine(dateStr){
  const n = joursEntre(E.profil.dateDebut, dateStr||aujourdhui());
  return Math.max(1, Math.floor(n/7) + 1 - (E.reglages.decalageSem||0));
}
function estDeload(sem){ return DELOADS.includes(sem); }

/* ============================================================
   CALCULS ÉNERGÉTIQUES
   ============================================================ */
function poidsActuel(){
  const m = moyenneMobile(aujourdhui(), 7);
  return m !== null ? m : E.profil.poidsDepart;
}
function metabolismeBase(){
  const p = poidsActuel(), t = E.profil.taille, a = E.profil.age;
  return Math.round(10*p + 6.25*t - 5*a + (E.profil.sexe==="h" ? 5 : -161));
}
function maintien(){ return Math.round(metabolismeBase() * 1.4 * 1.10); }

function surplusPhase(sem){
  if(sem <= 2) return 0;
  if(sem <= 4) return 150;
  return 350;
}
function kcalLivraisonJour(dateStr){
  const h = E.livraison[dateStr] || 0;
  return Math.round(h * (E.reglages.kcalLivraison||270));
}
function cibleKcal(dateStr){
  const d = dateStr || aujourdhui();
  return maintien() + surplusPhase(numSemaine(d)) + (E.reglages.ajustement||0) + kcalLivraisonJour(d);
}
function cibleMacros(dateStr){
  const kcal = cibleKcal(dateStr), p = poidsActuel();
  const prot = Math.round(p * E.reglages.ratioProt);
  const lip  = Math.round(p * E.reglages.ratioLip);
  const gluc = Math.max(0, Math.round((kcal - prot*4 - lip*9)/4));
  return {kcal, prot, lip, gluc};
}
function gainCible(){
  const p = poidsActuel();
  return {min:Math.round(p*2.5), max:Math.round(p*5)}; // grammes/semaine (0,25 % à 0,5 %)
}

/* ============================================================
   POIDS — moyenne mobile 7 jours
   ============================================================ */
function moyenneMobile(dateStr, fenetre){
  const vals=[];
  for(let i=0;i<fenetre;i++){
    const v = E.poids[dPlus(dateStr,-i)];
    if(typeof v === "number") vals.push(v);
  }
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
}
function serieMoyenneMobile(nbJours){
  const out=[], fin=aujourdhui();
  for(let i=nbJours-1;i>=0;i--){
    const d = dPlus(fin,-i);
    out.push({d, v:moyenneMobile(d,7), brut:E.poids[d] ?? null});
  }
  return out;
}
function nbPesees(){ return Object.keys(E.poids).length; }

/* ============================================================
   RECETTES — macros et coût calculés depuis la base aliments
   ============================================================ */
function toutesRecettes(){ return RECETTES.concat(E.recettesPerso||[]); }
function trouverRecette(id){ return toutesRecettes().find(r=>r.id===id) || null; }

function macrosRecette(r){
  let k=0,p=0,g=0,l=0,cout=0;
  (r.ing||[]).forEach(([id,gr])=>{
    const a = AL(id); if(!a) return;
    k += a.k*gr/100; p += a.p*gr/100; g += a.g*gr/100; l += a.l*gr/100;
    cout += a.prix*gr/1000;
  });
  return {kcal:Math.round(k), prot:Math.round(p), gluc:Math.round(g), lip:Math.round(l), cout:Math.round(cout*100)/100};
}
function kcalJour(dateStr){
  return (E.repas[dateStr]||[]).reduce((s,id)=>{
    const r = trouverRecette(id); return s + (r ? macrosRecette(r).kcal : 0);
  },0);
}
function macrosJour(dateStr){
  const t={kcal:0,prot:0,gluc:0,lip:0,cout:0};
  (E.repas[dateStr]||[]).forEach(id=>{
    const r = trouverRecette(id); if(!r) return;
    const m = macrosRecette(r);
    t.kcal+=m.kcal; t.prot+=m.prot; t.gluc+=m.gluc; t.lip+=m.lip; t.cout+=m.cout;
  });
  t.cout = Math.round(t.cout*100)/100;
  return t;
}

/* ============================================================
   SÉANCES
   ============================================================ */
function blocPourSemaine(sem){
  return BLOCS.find(b => sem >= b.s[0] && sem <= b.s[1]) || BLOCS[BLOCS.length-1];
}
function seancePrevue(dateStr){
  const d = dateStr || aujourdhui();
  const sem = numSemaine(d), bloc = blocPourSemaine(sem), jour = jourSemaine(d);
  if(bloc.freq === 4){
    const map = {1:0, 2:1, 4:2, 5:3};
    if(!(jour in map)) return null;
    return {bloc, seance:bloc.seances[map[jour]], deload:estDeload(sem), sem};
  }
  const map = {1:0, 3:1, 5:2};
  if(!(jour in map)) return null;
  const idx = (sem-1)*3 + map[jour];
  return {bloc, seance:bloc.seances[idx%2], deload:estDeload(sem), sem};
}
function seanceFaite(dateStr){ const s=E.seances[dateStr]; return !!(s && s.fini); }

function seriesEffectives(exDef, deload){
  return deload ? Math.max(1, Math.ceil(exDef[1]/2)) : exDef[1];
}
function meilleurePerf(exoId){
  let best = null;
  Object.entries(E.seances).forEach(([d,s])=>{
    const series = (s.ex||{})[exoId]; if(!series || !series.length) return;
    series.forEach(se=>{
      const score = (se.l||0)*3 + (se.r||0);
      if(!best || score > best.score) best = {score, r:se.r, l:se.l||0, d};
    });
  });
  return best;
}
function derniereSeanceExo(exoId){
  const dates = Object.keys(E.seances).filter(d => (E.seances[d].ex||{})[exoId]).sort();
  if(!dates.length) return null;
  const d = dates[dates.length-1];
  return {date:d, series:E.seances[d].ex[exoId]};
}

/* ============================================================
   ADHÉRENCE
   ============================================================ */
function adherence(nbJours){
  const fin = aujourdhui();
  let seancesPrevues=0, seancesFaites=0, joursRepas=0, joursOk=0, bio=[], heuresLivr=0;
  for(let i=0;i<nbJours;i++){
    const d = dPlus(fin,-i);
    if(joursEntre(E.profil.dateDebut, d) < 0) continue;
    if(seancePrevue(d)){ seancesPrevues++; if(seanceFaite(d)) seancesFaites++; }
    if(i>0 || (E.repas[d]||[]).length){
      joursRepas++;
      if(kcalJour(d) >= cibleKcal(d)*0.9) joursOk++;
    }
    const j = E.journal[d];
    if(j) bio.push((j.sommeil+j.energie+j.appetit+j.motiv)/4);
    heuresLivr += E.livraison[d]||0;
  }
  return {
    seancesPrevues, seancesFaites,
    tauxSeances: seancesPrevues ? seancesFaites/seancesPrevues : null,
    joursRepas, joursOk,
    tauxRepas: joursRepas ? joursOk/joursRepas : null,
    bioMoyen: bio.length ? bio.reduce((a,b)=>a+b,0)/bio.length : null,
    bioN: bio.length,
    heuresLivr: Math.round(heuresLivr*10)/10
  };
}

/* ============================================================
   MOTEUR D'ANALYSE — relecture toutes les 2 semaines
   Retourne une liste de constats classés par priorité.
   type : "alerte" | "action" | "ok" | "info"
   ============================================================ */
function analyser(){
  const out = [];
  const fin = aujourdhui();
  const sem = numSemaine(fin);
  const a14 = adherence(14);
  const maNow = moyenneMobile(fin, 7);
  const maAvant = moyenneMobile(dPlus(fin,-14), 7);
  const cible = gainCible();

  /* --- Données insuffisantes --- */
  if(nbPesees() < 6 || maNow === null){
    out.push({type:"info", t:"Pas encore assez de données",
      x:"Il me faut au moins 6 pesées, idéalement réparties sur 2 semaines, avant de pouvoir juger quoi que ce soit. Pèse-toi le matin à jeun, en sous-vêtements, avant de boire. Un chiffre isolé ne veut rien dire — c'est la moyenne sur 7 jours qui compte."});
    return out;
  }

  /* --- Deload en cours --- */
  if(estDeload(sem)){
    out.push({type:"info", t:"Semaine "+sem+" : deload",
      x:"Fais la moitié des séries prévues et arrête-toi à RIR 4. Tu vas te sentir frais et avoir l'impression de perdre ton temps — c'est exactement l'effet recherché. La fatigue accumulée se vide pendant que les adaptations se consolident. Les calories, elles, ne bougent pas."});
  }

  /* --- Signal de surcharge (priorité haute) --- */
  if(a14.bioMoyen !== null && a14.bioN >= 5 && a14.bioMoyen < 2.4){
    out.push({type:"alerte", t:"Signal de surcharge",
      x:"Ton biofeedback moyen est à "+a14.bioMoyen.toFixed(1)+"/5 sur les 14 derniers jours. Combiné à ton rythme (travail + livraison), c'est le profil classique d'une fatigue qui s'accumule. Réduis le volume de 30 % cette semaine et passe à RIR 3-4. Si le sommeil est en cause, supprime une séance plutôt que de rogner sur les nuits."});
  }

  /* --- Exécution avant réglage --- */
  let executionFaible = false;
  if(a14.tauxRepas !== null && a14.joursRepas >= 7 && a14.tauxRepas < 0.7){
    executionFaible = true;
    out.push({type:"action", t:"L'exécution avant le réglage",
      x:"Tu as atteint ta cible calorique sur "+a14.joursOk+" des "+a14.joursRepas+" derniers jours suivis, soit "+Math.round(a14.tauxRepas*100)+" %. Augmenter les calories maintenant ne servirait à rien : le problème n'est pas la cible, c'est l'écart entre la cible et l'assiette. Objectif de la quinzaine : passer à 85 % avant tout autre changement. Commence par sécuriser le shake, c'est le repas le plus facile à ne jamais rater."});
  }
  if(a14.tauxSeances !== null && a14.seancesPrevues >= 4 && a14.tauxSeances < 0.6){
    out.push({type:"action", t:"Séances trop irrégulières",
      x:"Tu as fait "+a14.seancesFaites+" séances sur "+a14.seancesPrevues+" prévues. En dessous de 60 %, aucun programme ne fonctionne. Baisse l'ambition plutôt que d'abandonner : passe à 2 séances Full Body par semaine, mais fais-les. Deux séances tenues battent quatre séances théoriques."});
  }

  /* --- Rythme de prise de poids --- */
  if(maAvant !== null){
    const deltaSem = Math.round((maNow - maAvant)/2*1000); // g/semaine
    const txt = (deltaSem>=0?"+":"")+deltaSem+" g/semaine";

    if(!executionFaible && deltaSem < cible.min*0.6){
      out.push({type:"action", t:"Rythme trop lent — "+txt, kcal:250,
        x:"Ta cible est de "+cible.min+" à "+cible.max+" g par semaine, tu es à "+deltaSem+" g. Ajoute 250 kcal par jour. Le plus simple : un shake supplémentaire, ou 40 g de beurre de cacahuète, ou deux cuillères à soupe d'huile réparties dans les plats. Vérifie aussi tes heures de livraison sur la période : "+a14.heuresLivr+" h en 14 jours, soit environ "+Math.round(a14.heuresLivr*(E.reglages.kcalLivraison||270)/14)+" kcal/jour de dépense supplémentaire."});
    }
    else if(!executionFaible && deltaSem >= cible.min*0.6 && deltaSem <= cible.max*1.15){
      out.push({type:"ok", t:"Rythme idéal — "+txt,
        x:"Tu es dans la fenêtre visée ("+cible.min+" à "+cible.max+" g/semaine). Ne change absolument rien : ni les calories, ni le programme. La discipline ici consiste à résister à l'envie d'accélérer. Reviens dans 14 jours."});
    }
    else if(deltaSem > cible.max*1.15){
      out.push({type:"action", t:"Rythme trop rapide — "+txt, kcal:-200,
        x:"Au-delà de "+cible.max+" g par semaine, la part qui s'ajoute est majoritairement du gras. Retire 200 kcal par jour. Si c'est la première quinzaine au-dessus, tu peux aussi attendre 14 jours de plus avant d'agir : une seule mesure peut être trompée par la rétention d'eau ou le transit."});
    }
  }

  /* --- Répartition du gain : muscle ou gras --- */
  const dates = Object.keys(E.mensurations).sort();
  if(dates.length >= 2){
    const p = E.mensurations[dates[0]], d = E.mensurations[dates[dates.length-1]];
    if(p.taille && d.taille && p.bras && d.bras){
      const dTaille = d.taille - p.taille, dBras = d.bras - p.bras;
      if(dTaille >= 3 && dBras <= 0.5){
        out.push({type:"action", t:"Le gain part surtout en gras", kcal:-200,
          x:"Ton tour de taille a pris "+dTaille.toFixed(1)+" cm pendant que ton tour de bras prenait "+dBras.toFixed(1)+" cm. La répartition n'est pas bonne. Réduis le surplus de 200 kcal et vérifie que tu atteins bien tes protéines chaque jour — c'est le levier le plus direct sur la répartition du gain."});
      } else if(dBras >= 1.5){
        out.push({type:"ok", t:"Bonne répartition du gain",
          x:"Tour de bras : +"+dBras.toFixed(1)+" cm. Tour de taille : +"+dTaille.toFixed(1)+" cm. C'est le rapport que l'on cherche. Le muscle se construit plus vite que le tissu adipeux, ce qui veut dire que le surplus est bien calibré."});
      }
    }
  }

  /* --- Charge de livraison --- */
  if(a14.heuresLivr >= 20){
    const kcalJ = Math.round(a14.heuresLivr*(E.reglages.kcalLivraison||270)/14);
    out.push({type:"info", t:a14.heuresLivr+" h de livraison en 14 jours",
      x:"Cela représente environ "+kcalJ+" kcal par jour de dépense supplémentaire, déjà ajoutés automatiquement à ta cible quotidienne. Deux points d'attention : ne place jamais une séance Bas le jour d'une tournée de plus de 4 h, et prépare tes shakes AVANT de partir — une tournée de 5 h sans manger, c'est plus de 1 000 kcal qui manquent à l'appel."});
  }

  /* --- Progression des charges --- */
  const bloc = blocPourSemaine(sem);
  if(!executionFaible && a14.seancesFaites >= 4){
    let progresse = 0, testes = 0;
    bloc.seances.forEach(s => s.ex.forEach(e => {
      const best = meilleurePerf(e[0]); if(!best) return;
      testes++;
      if(joursEntre(best.d, fin) <= 14) progresse++;
    }));
    if(testes >= 4 && progresse === 0){
      out.push({type:"action", t:"Aucun record depuis 2 semaines",
        x:"Tes meilleures performances datent toutes d'il y a plus de 14 jours. Si ton poids monte correctement et que tu dors, c'est probablement la proximité de l'échec qui est en cause : vérifie que tes séries s'arrêtent bien à 1-2 répétitions de l'échec réel, pas à la fatigue confortable. Sinon, passe à la variation supérieure de l'exercice concerné."});
    }
  }

  if(!out.length){
    out.push({type:"ok", t:"Rien à signaler",
      x:"Aucun signal négatif sur les 14 derniers jours. Continue exactement pareil."});
  }
  return out;
}

/* ============================================================
   LISTE DE COURSES — agrégée depuis le menu de la semaine
   ============================================================ */
const JOURS_MENU = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const MOMENTS = ["matin","midi","soir","shake","collation"];

function listeCourses(){
  const total = {};
  JOURS_MENU.forEach(j=>{
    const m = E.menu[j] || {};
    MOMENTS.forEach(mo=>{
      const id = m[mo]; if(!id) return;
      const r = trouverRecette(id); if(!r) return;
      (r.ing||[]).forEach(([ai,gr])=>{ total[ai] = (total[ai]||0) + gr; });
    });
  });
  const parRayon = {};
  Object.entries(total).forEach(([ai,gr])=>{
    const a = AL(ai); if(!a) return;
    (parRayon[a.r] = parRayon[a.r] || []).push({
      id:ai, nom:a.n, g:Math.round(gr), cout:Math.round(a.prix*gr/1000*100)/100
    });
  });
  Object.values(parRayon).forEach(l=>l.sort((x,y)=>y.cout-x.cout));
  const budget = Object.values(parRayon).flat().reduce((s,i)=>s+i.cout,0);
  return {parRayon, budget:Math.round(budget*100)/100};
}
function menuKcalJour(j){
  const m = E.menu[j]||{}; let k=0;
  MOMENTS.forEach(mo=>{ const r = m[mo] && trouverRecette(m[mo]); if(r) k += macrosRecette(r).kcal; });
  return k;
}


/* ============================================================
   PACKS — fiches recettes / exercices / aliments générées par
   une IA, importées et AJOUTÉES à l'existant.
   ============================================================ */
const MOMENTS_VALIDES = ["matin","midi","soir","shake","collation"];
const RAYONS = ["Épicerie","Frais","Boucherie","Conserves","Fruits & légumes","Surgelés","Compléments"];

function slug(txt){
  return "x" + String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,18) + Math.random().toString(36).slice(2,5);
}
function nettoyerJSON(txt){
  let t = String(txt).trim();
  t = t.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  const d = t.indexOf("{"), f = t.lastIndexOf("}");
  if(d > 0 || (f > -1 && f < t.length-1)) t = t.slice(d, f+1);
  return t;
}

/* Analyse un pack sans rien modifier. Retourne un rapport. */
function analyserPack(txt){
  const rap = {ok:false, nom:"", aliments:[], exercices:[], recettes:[], erreurs:[], doublons:[]};
  let d;
  try{ d = JSON.parse(nettoyerJSON(txt)); }
  catch(e){ rap.erreurs.push("Le texte n'est pas du JSON valide. Vérifie qu'il n'y a ni virgule en trop, ni texte autour."); return rap; }
  if(!d || typeof d !== "object" || Array.isArray(d)){
    rap.erreurs.push("Le fichier doit être un objet contenant les clés recettes, exercices ou aliments."); return rap; }
  if(d.profil && !d.recettes && !d.exercices){
    rap.erreurs.push("Ce fichier est une SAUVEGARDE complète, pas un pack. Utilise le bouton Restaurer une sauvegarde."); return rap; }
  rap.nom = String(d.pack || d.nom || "Pack sans nom").slice(0,60);

  const noms = {
    al: Object.keys(tousAliments()).map(k=>tousAliments()[k].n.toLowerCase()),
    ex: Object.keys(tousExos()).map(k=>tousExos()[k].n.toLowerCase()),
    re: toutesRecettes().map(r=>r.n.toLowerCase())
  };
  const dispo = tousAliments();   // les aliments du pack s'ajouteront au fur et à mesure

  /* --- Aliments --- */
  (d.aliments||[]).forEach((a,i)=>{
    const ou = "Aliment " + (a && a.n ? "« "+a.n+" »" : "n°"+(i+1));
    if(!a || !a.n){ rap.erreurs.push(ou+" : nom manquant."); return; }
    const id = a.id && /^[a-zA-Z][a-zA-Z0-9]*$/.test(a.id) ? a.id : slug(a.n);
    const nb = ["k","p","g","l","prix"].filter(c => typeof a[c] !== "number" || a[c] < 0);
    if(nb.length){ rap.erreurs.push(ou+" : valeurs manquantes ou négatives ("+nb.join(", ")+")."); return; }
    if(a.k > 950){ rap.erreurs.push(ou+" : "+a.k+" kcal/100 g est impossible (maximum 900, l'huile pure)."); return; }
    if(noms.al.indexOf(a.n.toLowerCase()) > -1){ rap.doublons.push(ou+" existe déjà, ignoré."); return; }
    const r = RAYONS.indexOf(a.r) > -1 ? a.r : "Épicerie";
    const obj = {n:String(a.n).slice(0,44), r, k:+a.k, p:+a.p, g:+a.g, l:+a.l, prix:+a.prix};
    dispo[id] = obj;
    rap.aliments.push([id, obj]);
  });

  /* --- Exercices --- */
  (d.exercices||[]).forEach((x,i)=>{
    const ou = "Exercice " + (x && x.n ? "« "+x.n+" »" : "n°"+(i+1));
    if(!x || !x.n){ rap.erreurs.push(ou+" : nom manquant."); return; }
    if(!PATRONS[x.pat]){ rap.erreurs.push(ou+" : patron « "+x.pat+" » inconnu. Valeurs acceptées : "+Object.keys(PATRONS).join(", ")+"."); return; }
    if(!Array.isArray(x.exec) || x.exec.length < 2){ rap.erreurs.push(ou+" : il faut au moins 2 étapes d'exécution."); return; }
    if(!Array.isArray(x.err) || x.err.length < 1){ rap.erreurs.push(ou+" : il faut au moins 1 erreur fréquente."); return; }
    if(x.fig && !FIGURES[x.fig]){ rap.erreurs.push(ou+" : figure « "+x.fig+" » inconnue. Laisse le champ vide ou choisis parmi : "+Object.keys(FIGURES).join(", ")+"."); return; }
    if(noms.ex.indexOf(x.n.toLowerCase()) > -1){ rap.doublons.push(ou+" existe déjà, ignoré."); return; }
    const id = slug(x.n);
    rap.exercices.push([id, {
      n:String(x.n).slice(0,48), pat:x.pat,
      niv: [1,2,3].indexOf(x.niv) > -1 ? x.niv : 2,
      repos: typeof x.repos === "number" ? Math.min(300, Math.max(30, x.repos)) : 120,
      tempo: x.tempo || "3-1-X",
      mus: Array.isArray(x.mus) ? x.mus.slice(0,5).map(String) : [],
      mat: Array.isArray(x.mat) ? x.mat.slice(0,4).map(String) : [],
      exec: x.exec.slice(0,7).map(String), err: x.err.slice(0,5).map(String),
      note: x.note ? String(x.note) : undefined,
      fig: x.fig || undefined, uni: !!x.uni, lest: !!x.lest, perso:true
    }]);
  });

  /* --- Recettes --- */
  (d.recettes||[]).forEach((r,i)=>{
    const ou = "Recette " + (r && r.n ? "« "+r.n+" »" : "n°"+(i+1));
    if(!r || !r.n){ rap.erreurs.push(ou+" : nom manquant."); return; }
    if(MOMENTS_VALIDES.indexOf(r.m) < 0){ rap.erreurs.push(ou+" : moment « "+r.m+" » inconnu. Valeurs acceptées : "+MOMENTS_VALIDES.join(", ")+"."); return; }
    if(!Array.isArray(r.ing) || !r.ing.length){ rap.erreurs.push(ou+" : aucun ingrédient."); return; }
    const inconnus = [], ing = [];
    r.ing.forEach(pair=>{
      if(!Array.isArray(pair) || pair.length < 2) return;
      const [ai, gr] = pair;
      if(!dispo[ai]){ inconnus.push(ai); return; }
      if(typeof gr !== "number" || gr <= 0 || gr > 2000) return;
      ing.push([ai, Math.round(gr)]);
    });
    if(inconnus.length){ rap.erreurs.push(ou+" : ingrédient(s) inconnu(s) — "+inconnus.join(", ")+". Utilise un identifiant de la liste, ou ajoute-le dans la section aliments du pack."); return; }
    if(!ing.length){ rap.erreurs.push(ou+" : aucun ingrédient exploitable."); return; }
    if(!Array.isArray(r.et) || !r.et.length){ rap.erreurs.push(ou+" : aucune étape de préparation."); return; }
    if(noms.re.indexOf(r.n.toLowerCase()) > -1){ rap.doublons.push(ou+" existe déjà, ignorée."); return; }
    const obj = {
      id: slug(r.n), n:String(r.n).slice(0,48), m:r.m,
      t: typeof r.t === "number" ? Math.min(180, Math.max(1, r.t)) : 15,
      mix: !!r.mix, ing, et: r.et.slice(0,10).map(String),
      as: r.as ? String(r.as) : undefined, perso:true
    };
    const mm = {k:0}; ing.forEach(([ai,g])=>{ mm.k += dispo[ai].k*g/100; });
    obj._kcal = Math.round(mm.k);
    if(obj._kcal < 60){ rap.erreurs.push(ou+" : seulement "+obj._kcal+" kcal, les grammages semblent erronés."); return; }
    rap.recettes.push(obj);
  });

  rap.total = rap.aliments.length + rap.exercices.length + rap.recettes.length;
  rap.ok = rap.total > 0;
  if(!rap.ok && !rap.erreurs.length && !rap.doublons.length)
    rap.erreurs.push("Le pack ne contient aucune recette, aucun exercice et aucun aliment.");
  return rap;
}

/* Applique un rapport validé : tout est AJOUTÉ, rien n'est écrasé. */
function appliquerPack(rap){
  E.alimentsPerso = E.alimentsPerso || {};
  E.exosPerso     = E.exosPerso || {};
  E.recettesPerso = E.recettesPerso || [];
  rap.aliments.forEach(([id,o]) => { E.alimentsPerso[id] = o; });
  rap.exercices.forEach(([id,o]) => { E.exosPerso[id] = o; });
  rap.recettes.forEach(o => { delete o._kcal; E.recettesPerso.push(o); });
  sauver();
  return rap.total;
}

/* ============================================================
   LA BARRE — signature : 52 semaines empilées
   ============================================================ */
function etatSemaine(s){
  const semNow = numSemaine();
  if(s > semNow) return "futur";
  const debut = dPlus(E.profil.dateDebut, (s-1)*7);
  let prevues=0, faites=0, joursOk=0, joursSuivis=0;
  for(let i=0;i<7;i++){
    const d = dPlus(debut,i);
    if(seancePrevue(d)){ prevues++; if(seanceFaite(d)) faites++; }
    if((E.repas[d]||[]).length){ joursSuivis++; if(kcalJour(d) >= cibleKcal(d)*0.9) joursOk++; }
  }
  if(!prevues && !joursSuivis) return "vide";
  const tS = prevues ? faites/prevues : 1;
  const tR = joursSuivis ? joursOk/Math.max(joursSuivis,5) : 0;
  const score = (tS + tR)/2;
  if(estDeload(s)) return score >= .5 ? "deload" : "vide";
  if(score >= .75) return "plein";
  if(score >= .3)  return "partiel";
  return "vide";
}
function largeurSemaine(s){
  const dep = E.profil.poidsDepart;
  const obj = dep + 11;
  const debut = dPlus(E.profil.dateDebut, (s-1)*7 + 6);
  let p = null;
  for(let i=0;i<7 && p===null;i++) p = moyenneMobile(dPlus(debut,-i), 7);
  if(p === null) return 22;
  return Math.max(22, Math.min(100, 22 + (p - dep)/(obj - dep)*78));
}
function barreAn(){
  const semNow = numSemaine();
  let h = "";
  for(let s=1;s<=52;s++){
    h += `<div class="sem ${etatSemaine(s)} ${s===semNow?"now":""}" style="width:${largeurSemaine(s)}%" title="Semaine ${s}"></div>`;
  }
  return h;
}
function barreCompacte(){
  const semNow = numSemaine();
  let h = "";
  for(let s=1;s<=52;s++){
    const e = etatSemaine(s);
    const col = {plein:"linear-gradient(180deg,var(--vrt-2),var(--vrt-4))",
                 partiel:"linear-gradient(180deg,var(--amb-2),var(--amb-4))",
                 deload:"linear-gradient(180deg,var(--blu-2),var(--blu-4))",
                 vide:"var(--nuit-3)", futur:"var(--nuit-2)"}[e];
    const ht = e==="futur" ? 20 : Math.max(24, largeurSemaine(s));
    h += `<i style="height:${ht}%;background:${col};${s===semNow?"box-shadow:0 0 8px var(--amb-o);outline:1px solid var(--amb-3)":""}"></i>`;
  }
  return h;
}

      const e = [exoEffectif(e0[0]), e0[1], e0[2], e0[3]];

      const remplace = e[0] !== e0[0];
      const nS = seriesEffectives(e, sp.deload);
      const saisies = (st.ex||{})[e[0]] || [];
      const best = meilleurePerf(e[0]);
      const der = derniereSeanceExo(e[0]);
      const pat = PATRONS[ex.pat];
      h += `<div class="carte ${pat.c}">
        <div class="carte-tete" style="align-items:flex-start">

        ${der ? `<div class="mini" style="margin-bottom:9px">Dernière fois (${dateCourte(der.date)}) : <span class="num">${der.series.map(s=>s.r+(s.l?"@"+s.l+"kg":"")).join(" · ")}</span></div>` : ""}
        <div class="entete-serie"><span></span><span>${ex.tempo==="iso"?"Sec.":"Reps"}</span><span>RIR</span><span>Lest kg</span><span></span></div>
        ${Array.from({length:nS}, (_,i)=>{
          const s = saisies[i] || {};

    h += `<div class="ligne" onclick="ouvrirBloc(${b.id})">

      ${IMPREVUS.map(i=>`<button class="chip" onclick="ouvrirImprevu('${i.id}')">${i.n}</button>`).join("")}

function prochaineSeanceTexte(){
  for(let i=1;i<=7;i++){
    const d = dPlus(aujourdhui(), i), sp = seancePrevue(d);
    if(sp) return `${JOURS_FR[jourSemaine(d)].toLowerCase()} (${sp.seance.n})`;
  }
  return "à définir";
}

function majSerie(exo, i, champ, val){
  const d = aujourdhui();
  const s = E.seances[d] || (E.seances[d] = {sid:(seancePrevue(d)||{seance:{}}).seance.id, ex:{}, fini:false});
  s.ex[exo] = s.ex[exo] || [];
  s.ex[exo][i] = s.ex[exo][i] || {};
  s.ex[exo][i][champ] = val === "" ? undefined : parseFloat(val);
  sauver();
}
function validerSerie(exo, i, repos){
  const d = aujourdhui();
  const s = E.seances[d] || (E.seances[d] = {sid:(seancePrevue(d)||{seance:{}}).seance.id, ex:{}, fini:false});
  s.ex[exo] = s.ex[exo] || [];
  s.ex[exo][i] = s.ex[exo][i] || {};
  s.ex[exo][i].ok = !s.ex[exo][i].ok;
  sauver();
  if(s.ex[exo][i].ok) minDemarrer(repos, "Repos");
  rendre();
}
function finirSeance(){
  const d = aujourdhui();
  const s = E.seances[d] || (E.seances[d] = {sid:(seancePrevue(d)||{seance:{}}).seance.id, ex:{}, fini:false});
  s.fini = !s.fini; sauver(); rendre();
  toast(s.fini ? "Séance validée" : "Séance rouverte");
}

function courbePoids(){
  const s = serieMoyenneMobile(60).filter(p => p.v !== null || p.brut !== null);
  if(s.length < 2) return `<div class="vide-etat" style="padding:24px 10px"><div class="mini">Pèse-toi 6 fois pour voir apparaître ta courbe.</div></div>`;
  const W = 320, H = 92, P = 5;
  const vals = s.map(p=>p.v ?? p.brut).filter(v=>v!==null);
  const dep = E.profil.poidsDepart;
  let mn = Math.min(...vals, dep) - .6, mx = Math.max(...vals, dep) + .6;
  if(mx - mn < 2){ const c=(mx+mn)/2; mn=c-1; mx=c+1; }
  const X = i => P + i/(s.length-1)*(W-2*P);
  const Y = v => H - P - (v-mn)/(mx-mn)*(H-2*P);

  const pts = s.map((p,i)=>p.v!==null ? [X(i), Y(p.v)] : null).filter(Boolean);
  const ligne = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const aire = pts.length ? ligne+` L${pts[pts.length-1][0].toFixed(1)} ${H-P} L${pts[0][0].toFixed(1)} ${H-P} Z` : "";
  const dots = s.map((p,i)=>p.brut!==null ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.brut).toFixed(1)}" r="1.5" fill="var(--txt-3)"/>` : "").join("");

  /* bande cible : +0,25 %/sem à +0,5 %/sem depuis le départ */
  const nJ = s.length;
  const bas = dep + dep*0.0025*(nJ/7), haut = dep + dep*0.005*(nJ/7);
  const bande = (Y(dep) > Y(haut)) ?
    `<path d="M${X(0)} ${Y(dep)} L${X(nJ-1)} ${Y(bas)} L${X(nJ-1)} ${Y(haut)} L${X(0)} ${Y(dep)} Z" fill="var(--vrt-o)"/>` : "";

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="none">
    <defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--amb-2)" stop-opacity=".26"/>
      <stop offset="100%" stop-color="var(--amb-2)" stop-opacity="0"/></linearGradient></defs>
    ${bande}
    <line x1="${P}" y1="${Y(dep).toFixed(1)}" x2="${W-P}" y2="${Y(dep).toFixed(1)}" stroke="var(--bord-2)" stroke-width=".7" stroke-dasharray="3 3"/>
    ${aire?`<path d="${aire}" fill="url(#gp)"/>`:""}
    <path d="${ligne}" fill="none" stroke="var(--amb-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

/* ============================================================
   MINUTEUR DE REPOS ET GUIDE DE TEMPO
   ============================================================ */
let MIN = {t:0, total:0, h:null, wake:null};
async function verrouEcran(on){
  try{
    if(on && "wakeLock" in navigator && !MIN.wake) MIN.wake = await navigator.wakeLock.request("screen");
    else if(!on && MIN.wake){ MIN.wake.release(); MIN.wake = null; }
  }catch(e){}
}
function minDemarrer(sec, titre){
  MIN.t = sec; MIN.total = sec;
  document.getElementById("min-titre").textContent = titre || "Repos";
  document.getElementById("min-l").textContent = "restant";
  document.getElementById("minuteur").classList.add("on");
  document.getElementById("cadran").style.display = "";
  document.getElementById("cadran").innerHTML =
    '<div class="cadran-txt"><div class="t" id="min-t"></div><div class="l" id="min-l">restant</div></div>';
  verrouEcran(true);
  majMin();
  clearInterval(MIN.h);
  MIN.h = setInterval(()=>{
    MIN.t--; majMin();
    if(MIN.t <= 0) finMin();
  }, 1000);
}
function majMin(){
  const m = Math.floor(Math.max(0,MIN.t)/60), s = Math.max(0,MIN.t)%60;
  const el = document.getElementById("min-t");
  if(el) el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  const c = document.getElementById("cadran");
  if(c) c.style.setProperty("--p", (MIN.total ? Math.max(0,MIN.t)/MIN.total : 0).toFixed(3));
}
function finMin(){
  clearInterval(MIN.h);
  bip();
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
  const l = document.getElementById("min-l");
  if(l) l.textContent = "série suivante";
  setTimeout(minStop, 1600);
}
function minStop(){
  clearInterval(MIN.h);
  document.getElementById("minuteur").classList.remove("on");
  verrouEcran(false);
}
function minAjouter(n){
  MIN.t = Math.max(1, MIN.t + n);
  MIN.total = Math.max(MIN.total, MIN.t);
  majMin();
}
function bip(){
  try{
    const A = new (window.AudioContext||window.webkitAudioContext)();
    [0,.16,.32].forEach((d,i)=>{
      const o = A.createOscillator(), g = A.createGain();
      o.connect(g); g.connect(A.destination);
      o.frequency.value = i===2 ? 1046 : 784; o.type = "sine";
      g.gain.setValueAtTime(0, A.currentTime+d);
      g.gain.linearRampToValueAtTime(.2, A.currentTime+d+.015);
      g.gain.exponentialRampToValueAtTime(.001, A.currentTime+d+.13);
      o.start(A.currentTime+d); o.stop(A.currentTime+d+.14);
    });
  }catch(e){}
}

/* Guide de tempo : 3-1-X = 3 s descente, 1 s pause, remontée explosive */
function lancerTempo(tempo){
  const [ec, pa] = tempo.split("-");
  const exc = parseFloat(ec)||3, pau = parseFloat(pa)||1;
  fermerFeuille();
  const z = document.getElementById("minuteur");
  z.classList.add("on");
  document.getElementById("min-titre").textContent = `Tempo ${tempo}`;
  const c = document.getElementById("cadran");
  c.style.display = "none";
  let bulle = document.getElementById("tempo-bulle");
  if(!bulle){
    bulle = document.createElement("div");
    bulle.className = "tempo-bulle"; bulle.id = "tempo-bulle";
    c.parentNode.insertBefore(bulle, c.nextSibling);
  }
  bulle.style.display = "grid";
  verrouEcran(true);
  clearInterval(MIN.h);
  let phase = 0, t = 0;
  const seq = [
    {n:"Descends", d:exc, s0:1, s1:.62},
    {n:"Tiens",    d:pau, s0:.62, s1:.62},
    {n:"Pousse",   d:1,   s0:.62, s1:1},
    {n:"Prêt",     d:.6,  s0:1, s1:1}
  ];
  MIN.h = setInterval(()=>{
    const p = seq[phase];
    t += .1;
    const k = Math.min(1, t/p.d);
    bulle.style.transform = `scale(${(p.s0 + (p.s1-p.s0)*k).toFixed(3)})`;
    bulle.textContent = p.n;
    bulle.style.borderColor = phase===0 ? "var(--blu-3)" : phase===1 ? "var(--amb-3)" : phase===2 ? "var(--vrt-3)" : "var(--bord)";
    if(t >= p.d){
      t = 0; phase = (phase+1) % seq.length;
      if(phase === 0 && navigator.vibrate) navigator.vibrate(28);
    }
  }, 100);
  const stop = () => {
    clearInterval(MIN.h);
    bulle.style.display = "none";
    c.style.display = "";
    z.classList.remove("on");
    verrouEcran(false);
  };
  window._stopTempo = stop;
}
const _minStopOrig = minStop;
minStop = function(){ if(window._stopTempo){ window._stopTempo(); window._stopTempo = null; return; } _minStopOrig(); };

    </div>

      <div class="eyebrow" style="margin-bottom:7px">Ta bibliothèque personnelle</div>
      <div class="mini" style="margin-bottom:9px">${(E.recettesPerso||[]).length} recette(s) · ${Object.keys(E.exosPerso||{}).length} exercice(s) · ${Object.keys(E.alimentsPerso||{}).length} aliment(s) ajoutés</div>

function chargerFichierPack(){
  const i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json,.txt";
  i.onchange = () => {
    const f = i.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { document.getElementById("pack-txt").value = rd.result; verifierPack(); };
    rd.readAsText(f);
  };
  i.click();
}

function verifierPack(){
  const txt = document.getElementById("pack-txt").value.trim();
  const zone = document.getElementById("pack-res");
  if(!txt){ zone.innerHTML = `<div class="constat alerte" style="margin-top:13px"><h4>Rien à vérifier</h4><p>Colle d'abord le JSON produit par l'IA dans le champ ci-dessus.</p></div>`; return; }

  const r = analyserPack(txt);
  PACK_RAPPORT = r;
  const ligne = (t,d) => `<div class="ligne" style="cursor:default"><div class="corps"><div class="titre">${esc(t)}</div><div class="det">${d}</div></div><div class="coche on">✓</div></div>`;

  zone.innerHTML = `
    ${r.erreurs.length ? `<div class="constat alerte" style="margin-top:13px">
      <h4>${r.erreurs.length} problème${r.erreurs.length>1?"s":""} à corriger</h4>
      <ul class="notes ros" style="margin-top:7px">${r.erreurs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
      <p style="margin-top:9px">Renvoie ces messages à l'IA telle quelle : ils sont écrits pour qu'elle puisse corriger directement.</p></div>` : ""}

    ${r.doublons.length ? `<div class="constat info" style="margin-top:13px">
      <h4>${r.doublons.length} doublon${r.doublons.length>1?"s":""} ignoré${r.doublons.length>1?"s":""}</h4>
      <ul class="notes" style="margin-top:7px">${r.doublons.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}

    ${r.ok ? `<div class="carte green" style="margin-top:13px">
      <div class="eyebrow">Prêt à ajouter · ${esc(r.nom)}</div>
      <h3 style="margin:6px 0 11px">${r.total} fiche${r.total>1?"s":""} valide${r.total>1?"s":""}</h3>
      ${r.aliments.map(a=>ligne(a[1].n, `Aliment · ${a[1].r} · ${a[1].k} kcal/100 g · ${a[1].prix.toFixed(2)} €/kg`)).join("")}
      ${r.exercices.map(x=>ligne(x[1].n, `Exercice · ${PATRONS[x[1].pat].n} · niveau ${x[1].niv}${x[1].fig?" · avec figure":" · sans figure"}`)).join("")}
      ${r.recettes.map(re=>ligne(re.n, `Recette · ${re.m} · ${re._kcal} kcal · ${re.t} min`)).join("")}
      <button class="btn vert large" style="margin-top:13px" onclick="validerPack()">Ajouter à ma bibliothèque</button>
    </div>` : ""}`;
}

function validerPack(){
  if(!PACK_RAPPORT || !PACK_RAPPORT.ok) return;
  const n = appliquerPack(PACK_RAPPORT);
  PACK_RAPPORT = null;
  fermerFeuille(); rendre();
  toast(n + " fiche" + (n>1?"s ajoutées":" ajoutée"));
}

function exporterPersos(){
  const pack = {
    pack: "Ma bibliothèque — " + aujourdhui(),
    aliments: Object.keys(E.alimentsPerso||{}).map(id => Object.assign({id}, E.alimentsPerso[id])),
    exercices: Object.keys(E.exosPerso||{}).map(id => {
      const o = Object.assign({}, E.exosPerso[id]); delete o.perso; return o; }),
    recettes: (E.recettesPerso||[]).map(r => {
      const o = Object.assign({}, r); delete o.id; delete o.perso; return o; })
  };
  const b = new Blob([JSON.stringify(pack,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = `pack-perso-${aujourdhui()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Pack exporté");
}

/* ---------- Consigne prête à coller dans une IA ---------- */
function consignePack(type){
  const TA = tousAliments();
  const listeAl = Object.keys(TA).map(id => `${id} (${TA[id].n})`).join(" · ");
  const listeFig = Object.keys(FIGURES).join(" · ");
  const listePat = Object.keys(PATRONS).map(k => `${k} = ${PATRONS[k].n}`).join(" · ");
  const c = cibleMacros();
  const p = E.profil;

  const blocRecette = `RECETTE
{"n":"Nom", "m":"matin|midi|soir|shake|collation", "t":minutes, "mix":true si un mixeur est nécessaire,
 "ing":[["identifiantAliment", grammes], ...], "et":["étape 1","étape 2"], "as":"une astuce utile"}
N'écris JAMAIS les calories, les macros ou le prix : l'application les calcule à partir des grammages.
Les grammages sont en grammes de produit cru, entre 1 et 2000.`;

  const blocExo = `EXERCICE
{"n":"Nom", "pat":"un patron de la liste", "niv":1|2|3, "repos":secondes, "tempo":"3-1-X",
 "mus":["Pectoraux","Triceps"], "mat":["Chaise"], "uni":true si unilatéral, "lest":true si lesté,
 "exec":["étape 1","étape 2","étape 3"], "err":["erreur fréquente 1","erreur 2"],
 "fig":"identifiant de figure", "note":"remarque optionnelle"}
Patrons acceptés : ${listePat}
"exec" : minimum 2 étapes. "err" : minimum 1 erreur.
"fig" est facultatif mais recommandé — choisis la figure existante la plus proche du mouvement, ou omets le champ.
Figures disponibles : ${listeFig}`;

  const blocAliment = `ALIMENT — uniquement si un ingrédient dont tu as besoin n'existe pas dans la liste
{"id":"identifiantSansAccentNiEspace", "n":"Nom lisible",
 "r":"Épicerie|Frais|Boucherie|Conserves|Fruits & légumes|Surgelés|Compléments",
 "k":kcal pour 100 g, "p":protéines, "g":glucides, "l":lipides, "prix":euros par kilo}
Place les aliments AVANT les recettes qui les utilisent : elles pourront alors y faire référence.`;

  const sections = type === "recettes" ? [blocRecette, blocAliment]
                 : type === "exercices" ? [blocExo]
                 : [blocRecette, blocExo, blocAliment];

  return `Tu vas produire un « pack » au format JSON pour mon application de suivi sportif.

RÈGLE ABSOLUE
Réponds uniquement par le JSON. Aucun texte avant, aucun texte après, aucune balise de code.

STRUCTURE
{"pack":"nom court du pack", "recettes":[...], "exercices":[...], "aliments":[...]}
Les trois sections sont facultatives : ne mets que celles qui sont demandées.

${sections.join("\n\n")}

${type !== "exercices" ? `IDENTIFIANTS D'ALIMENTS DÉJÀ DISPONIBLES
${listeAl}

` : ""}MON PROFIL
Homme, ${p.age} ans, ${p.taille} cm, ${poidsActuel().toFixed(1)} kg. Objectif : prise de masse.
Cible actuelle ${c.kcal} kcal par jour, ${c.prot} g de protéines.
Entraînement à domicile : sac à dos lesté, barre de traction, chaise, table, mur. Pas de salle.
Livreur à vélo électrique : je mange souvent en déplacement, sans frigo ni micro-ondes.
Budget serré : privilégie les ingrédients bon marché.
Je ne mange ni endive ni céleri.

CE QUE JE VEUX
[Écris ici ta demande. Par exemple : « 8 dîners de moins de 20 minutes et moins de 2 € »,
 « 5 variantes de tractions pour progresser vers la traction lestée »,
 « des recettes riches en calories qui se transportent dans un sac de livraison ».]`;
}

function copierConsigne(type){
  const txt = consignePack(type);
  copierTexte(txt, "Consigne copiée — colle-la dans ta conversation avec l'IA");
}
function copierTexte(txt, msg){
  const secours = () => {
    const t = document.createElement("textarea");
    t.value = txt; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.focus(); t.select();
    try{ document.execCommand("copy"); toast(msg); }
    catch(e){ montrerTexteACopier(txt); }
    document.body.removeChild(t);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(secours);
  } else secours();
}
function montrerTexteACopier(txt){
  feuille(`<h2 style="margin-bottom:5px">Copie manuelle</h2>
    <p class="sub">La copie automatique a été refusée par le navigateur. Sélectionne tout le texte ci-dessous et copie-le à la main.</p>
    <textarea rows="14" readonly style="font-family:var(--mono);font-size:11px;line-height:1.45">${esc(txt)}</textarea>`);
}
