  return h;
}
function prochaineSeanceTexte(){
  for(let i=1;i<=7;i++){
    const d = dPlus(aujourdhui(), i), sp = seancePrevue(d);
    if(sp) return `${JOURS_FR[jourSemaine(d)].toLowerCase()} (${sp.seance.n})`;
  }
  return "à définir";
}

function majSerie(exo, i, champ, val){
  const d = aujourdhui();
  const s = E.seances[d] || (E.seances[d] = {sid:(seancePrevue(d)||{seance:{}}).seance.id, ex:{}, fini:false});
  s.ex[exo] = s.ex[exo] || [];
  s.ex[exo][i] = s.ex[exo][i] || {};
  s.ex[exo][i][champ] = val === "" ? undefined : parseFloat(val);
  sauver();
}
function validerSerie(exo, i, repos){
  const d = aujourdhui();
  const s = E.seances[d] || (E.seances[d] = {sid:(seancePrevue(d)||{seance:{}}).seance.id, ex:{}, fini:false});
  s.ex[exo] = s.ex[exo] || [];
  s.ex[exo][i] = s.ex[exo][i] || {};
  s.ex[exo][i].ok = !s.ex[exo][i].ok;
  sauver();
  if(s.ex[exo][i].ok) minDemarrer(repos, "Repos");
  rendre();
}
function finirSeance(){
  const d = aujourdhui();
  const s = E.seances[d] || (E.seances[d] = {sid:(seancePrevue(d)||{seance:{}}).seance.id, ex:{}, fini:false});
  s.fini = !s.fini; sauver(); rendre();
  toast(s.fini ? "Séance validée" : "Séance rouverte");
}

function mangerRecette(id){
  const d = aujourdhui();
  E.repas[d] = E.repas[d] || [];
  E.repas[d].push(id);
  sauver(); fermerFeuille(); rendre();
  const r = trouverRecette(id);
  const reste = Math.max(0, cibleKcal(d) - kcalJour(d));
  toast(reste ? `+${macrosRecette(r).kcal} kcal · reste ${reste}` : "Cible atteinte");
}
function retirerRepas(i){
  const d = aujourdhui();
  (E.repas[d]||[]).splice(i,1); sauver(); rendre();
}
function supprimerRecette(id){
  E.recettesPerso = (E.recettesPerso||[]).filter(r=>r.id!==id);

function enregistrerRecette(){
  const nom = document.getElementById("nr-nom").value.trim();
  if(!nom) return toast("Il manque le nom");
  const ing = [];
  document.querySelectorAll("[data-al]").forEach(i=>{

    if(g > 0) ing.push([i.dataset.al, g]);
  });
  if(!ing.length) return toast("Il manque les ingrédients");
  const et = document.getElementById("nr-etapes").value.split("\n").map(s=>s.trim()).filter(Boolean);
  E.recettesPerso = E.recettesPerso || [];
  E.recettesPerso.push({
    id:"p"+Date.now(), n:nom, m:document.getElementById("nr-moment").value,
    t:parseInt(document.getElementById("nr-temps").value)||15, mix:false, ing, et,
    as:"Recette que tu as ajoutée toi-même."
  });
  sauver(); fermerFeuille(); FILTRE_REPAS="perso"; rendre(); toast("Recette ajoutée");
}

function choisirRecette(jour, moment){
  const liste = toutesRecettes().filter(r => moment==="shake" ? r.m==="shake" : moment==="collation" ? r.m==="collation" : r.m===moment);
  const autres = toutesRecettes().filter(r => !liste.includes(r));
  const carte = r => { const m = macrosRecette(r);
    return `<div class="ligne" onclick="poserRecette('${jour}','${moment}','${r.id}')">
      <div class="puce violet">${m.kcal>=600?"◆":"◇"}</div>
      <div class="corps"><div class="titre">${esc(r.n)}</div>
        <div class="det">${m.kcal} kcal · ${m.prot} g prot · ${m.cout.toFixed(2)} €</div></div></div>`;};
  feuille(`
    <div class="eyebrow">${jour} · ${moment}</div>
    <h2 style="margin:7px 0 13px">Choisir une recette</h2>
    ${(E.menu[jour]||{})[moment] ? `<button class="btn fant large" style="margin-bottom:13px" onclick="poserRecette('${jour}','${moment}','')">Retirer ce repas</button>`:""}
    ${liste.map(carte).join("")}
    <div class="eyebrow" style="margin:17px 0 4px">Autres moments</div>
    ${autres.map(carte).join("")}`);

function poserRecette(jour, moment, id){
  E.menu[jour] = E.menu[jour] || {};
  if(id) E.menu[jour][moment] = id; else delete E.menu[jour][moment];
  E.coursesCochees = []; sauver(); fermerFeuille(); rendre();
}

function courbePoids(){
  const s = serieMoyenneMobile(60).filter(p => p.v !== null || p.brut !== null);
  if(s.length < 2) return `<div class="vide-etat" style="padding:24px 10px"><div class="mini">Pèse-toi 6 fois pour voir apparaître ta courbe.</div></div>`;
  const W = 320, H = 92, P = 5;
  const vals = s.map(p=>p.v ?? p.brut).filter(v=>v!==null);
  const dep = E.profil.poidsDepart;
  let mn = Math.min(...vals, dep) - .6, mx = Math.max(...vals, dep) + .6;
  if(mx - mn < 2){ const c=(mx+mn)/2; mn=c-1; mx=c+1; }
  const X = i => P + i/(s.length-1)*(W-2*P);
  const Y = v => H - P - (v-mn)/(mx-mn)*(H-2*P);

  const pts = s.map((p,i)=>p.v!==null ? [X(i), Y(p.v)] : null).filter(Boolean);
  const ligne = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const aire = pts.length ? ligne+` L${pts[pts.length-1][0].toFixed(1)} ${H-P} L${pts[0][0].toFixed(1)} ${H-P} Z` : "";
  const dots = s.map((p,i)=>p.brut!==null ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.brut).toFixed(1)}" r="1.5" fill="var(--txt-3)"/>` : "").join("");

  /* bande cible : +0,25 %/sem à +0,5 %/sem depuis le départ */
  const nJ = s.length;
  const bas = dep + dep*0.0025*(nJ/7), haut = dep + dep*0.005*(nJ/7);
  const bande = (Y(dep) > Y(haut)) ?
    `<path d="M${X(0)} ${Y(dep)} L${X(nJ-1)} ${Y(bas)} L${X(nJ-1)} ${Y(haut)} L${X(0)} ${Y(dep)} Z" fill="var(--vrt-o)"/>` : "";

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="none">
    <defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--amb-2)" stop-opacity=".26"/>
      <stop offset="100%" stop-color="var(--amb-2)" stop-opacity="0"/></linearGradient></defs>
    ${bande}
    <line x1="${P}" y1="${Y(dep).toFixed(1)}" x2="${W-P}" y2="${Y(dep).toFixed(1)}" stroke="var(--bord-2)" stroke-width=".7" stroke-dasharray="3 3"/>
    ${aire?`<path d="${aire}" fill="url(#gp)"/>`:""}
    <path d="${ligne}" fill="none" stroke="var(--amb-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}
function appliquerAjustement(k){
  E.reglages.ajustement = (E.reglages.ajustement||0) + k;
  sauver(); rendre();
  toast(`Cible ajustée : ${cibleKcal()} kcal`);
}

    <div class="eyebrow">${pat.n} · niveau ${ex.niv} sur 3${estPerso(id) ? " · importé" : ""}</div>

  E.remplacements = E.remplacements || {};
  if(nouveau) E.remplacements[original] = nouveau; else delete E.remplacements[original];
  sauver(); fermerFeuille(); rendre();
  toast(nouveau ? "Remplacé par "+tousExos()[nouveau].n : "Exercice d'origine rétabli");
}

/* ============================================================
   MINUTEUR DE REPOS ET GUIDE DE TEMPO
   ============================================================ */
let MIN = {t:0, total:0, h:null, wake:null};
async function verrouEcran(on){
  try{
    if(on && "wakeLock" in navigator && !MIN.wake) MIN.wake = await navigator.wakeLock.request("screen");
    else if(!on && MIN.wake){ MIN.wake.release(); MIN.wake = null; }
  }catch(e){}
}
function minDemarrer(sec, titre){
  MIN.t = sec; MIN.total = sec;
  document.getElementById("min-titre").textContent = titre || "Repos";
  document.getElementById("min-l").textContent = "restant";
  document.getElementById("minuteur").classList.add("on");
  document.getElementById("cadran").style.display = "";
  document.getElementById("cadran").innerHTML =
    '<div class="cadran-txt"><div class="t" id="min-t"></div><div class="l" id="min-l">restant</div></div>';
  verrouEcran(true);
  majMin();
  clearInterval(MIN.h);
  MIN.h = setInterval(()=>{
    MIN.t--; majMin();
    if(MIN.t <= 0) finMin();
  }, 1000);
}
function majMin(){
  const m = Math.floor(Math.max(0,MIN.t)/60), s = Math.max(0,MIN.t)%60;
  const el = document.getElementById("min-t");
  if(el) el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  const c = document.getElementById("cadran");
  if(c) c.style.setProperty("--p", (MIN.total ? Math.max(0,MIN.t)/MIN.total : 0).toFixed(3));
}
function finMin(){
  clearInterval(MIN.h);
  bip();
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
  const l = document.getElementById("min-l");
  if(l) l.textContent = "série suivante";
  setTimeout(minStop, 1600);
}
function minStop(){
  clearInterval(MIN.h);
  document.getElementById("minuteur").classList.remove("on");
  verrouEcran(false);
}
function minAjouter(n){
  MIN.t = Math.max(1, MIN.t + n);
  MIN.total = Math.max(MIN.total, MIN.t);
  majMin();
}
function bip(){
  try{
    const A = new (window.AudioContext||window.webkitAudioContext)();
    [0,.16,.32].forEach((d,i)=>{
      const o = A.createOscillator(), g = A.createGain();
      o.connect(g); g.connect(A.destination);
      o.frequency.value = i===2 ? 1046 : 784; o.type = "sine";
      g.gain.setValueAtTime(0, A.currentTime+d);
      g.gain.linearRampToValueAtTime(.2, A.currentTime+d+.015);
      g.gain.exponentialRampToValueAtTime(.001, A.currentTime+d+.13);
      o.start(A.currentTime+d); o.stop(A.currentTime+d+.14);
    });
  }catch(e){}
}

/* Guide de tempo : 3-1-X = 3 s descente, 1 s pause, remontée explosive */
function lancerTempo(tempo){
  const [ec, pa] = tempo.split("-");
  const exc = parseFloat(ec)||3, pau = parseFloat(pa)||1;
  fermerFeuille();
  const z = document.getElementById("minuteur");
  z.classList.add("on");
  document.getElementById("min-titre").textContent = `Tempo ${tempo}`;
  const c = document.getElementById("cadran");
  c.style.display = "none";
  let bulle = document.getElementById("tempo-bulle");
  if(!bulle){
    bulle = document.createElement("div");
    bulle.className = "tempo-bulle"; bulle.id = "tempo-bulle";
    c.parentNode.insertBefore(bulle, c.nextSibling);
  }
  bulle.style.display = "grid";
  verrouEcran(true);
  clearInterval(MIN.h);
  let phase = 0, t = 0;
  const seq = [
    {n:"Descends", d:exc, s0:1, s1:.62},
    {n:"Tiens",    d:pau, s0:.62, s1:.62},
    {n:"Pousse",   d:1,   s0:.62, s1:1},
    {n:"Prêt",     d:.6,  s0:1, s1:1}
  ];
  MIN.h = setInterval(()=>{
    const p = seq[phase];
    t += .1;
    const k = Math.min(1, t/p.d);
    bulle.style.transform = `scale(${(p.s0 + (p.s1-p.s0)*k).toFixed(3)})`;
    bulle.textContent = p.n;
    bulle.style.borderColor = phase===0 ? "var(--blu-3)" : phase===1 ? "var(--amb-3)" : phase===2 ? "var(--vrt-3)" : "var(--bord)";
    if(t >= p.d){
      t = 0; phase = (phase+1) % seq.length;
      if(phase === 0 && navigator.vibrate) navigator.vibrate(28);
    }
  }, 100);
  const stop = () => {
    clearInterval(MIN.h);
    bulle.style.display = "none";
    c.style.display = "";
    z.classList.remove("on");
    verrouEcran(false);
  };
  window._stopTempo = stop;
}
const _minStopOrig = minStop;
minStop = function(){ if(window._stopTempo){ window._stopTempo(); window._stopTempo = null; return; } _minStopOrig(); };

function normMenu(v){ return !v ? null : (typeof v === "string" ? {i:v, q:1} : {i:v.i, q:v.q||1}); }
function fmtQ(q){ return q === 1 ? "" : " ×" + (Math.round(q*100)/100); }
function uPoids(kg){ return E.profil.unitePoids === "lb" ? Math.round(kg*2.2046*10)/10 : Math.round(kg*10)/10; }
function nPoids(){ return E.profil.unitePoids === "lb" ? "lb" : "kg"; }
function versKg(v){ return E.profil.unitePoids === "lb" ? v/2.2046 : v; }

/* ============================================================
   ONBOARDING
   ============================================================ */
let ETAPE = 0;
const N_ETAPES = 7;

function ouvrirOnboarding(reprise){
  ETAPE = reprise || 0;
  rendreEtape();
}
function rendreEtape(){
  const p = E.profil;
  const barre = `<div style="display:flex;gap:4px;margin-bottom:19px">
    ${Array.from({length:N_ETAPES},(_,i)=>`<div style="flex:1;height:3px;border-radius:2px;background:${i<=ETAPE?"linear-gradient(90deg,var(--amb-3),var(--amb-1))":"var(--nuit-3)"}"></div>`).join("")}

  const suite = (txt, action) => `<button class="btn plein large" style="margin-top:17px" onclick="${action||"etapeSuivante()"}">${txt||"Continuer"}</button>`;
  const retour = ETAPE > 0 ? `<button class="btn fant large" style="margin-top:8px" onclick="ETAPE--;rendreEtape()">Retour</button>` : "";

  if(ETAPE === 0){
    h += `<div class="eyebrow">Étape 1 sur ${N_ETAPES}</div>

  else if(ETAPE === 1){
    h += `<div class="eyebrow">Étape 2 sur ${N_ETAPES}</div>
      <h2 style="margin:7px 0 5px">Ton point de départ</h2>

  else if(ETAPE === 2){

  }

  else if(ETAPE === 5){
    h += `<div class="eyebrow">Étape 6 sur ${N_ETAPES}</div>

        const r = REGIMES[k], on = p.regime===k;
        return `<div class="ligne" onclick="E.profil.regime='${k}';rendreEtape()">
          <div class="coche ${on?"on":""}">✓</div>

      }).join("")}

      <div class="chips" style="padding-bottom:0;flex-wrap:wrap">
        ${Object.keys(INTOLERANCES).map(k=>`<button class="chip ${(p.intolerances||[]).indexOf(k)>-1?"on":""}" onclick="basculerIntolerance('${k}')">${INTOLERANCES[k].n}</button>`).join("")}
      </div>
      <div class="mini" style="margin-top:11px">Recettes compatibles avec ces réglages : <b class="vrt">${RECETTES.filter(recetteCompatible).length}</b> sur ${RECETTES.length}. Tu pourras en importer d'autres à tout moment.</div>`
      + suite() + retour;

  else if(ETAPE === 6){
    h += `<div class="eyebrow">Étape 7 sur ${N_ETAPES}</div>

        return `<div class="ligne" onclick="E.profil.niveau='${k}';rendreEtape()">

      </div>

  }
  feuille(h);
}
function etapeSuivante(){ ETAPE++; sauver(); rendreEtape(); }
function validerEtape0(){
  const v = id => document.getElementById(id);
  E.profil.prenom = (v("o-prenom").value||"").trim().slice(0,20);
  E.profil.age = Math.min(90, Math.max(14, parseInt(v("o-age").value) || 30));
  const u = v("o-unite").value;
  E.profil.unitePoids = u; E.profil.uniteTaille = u === "lb" ? "in" : "cm";
  etapeSuivante();
}
function validerEtape1(){
  const v = id => parseFloat(document.getElementById(id).value);
  let t = v("o-taille") || E.profil.taille;
  if(E.profil.uniteTaille === "in") t = t * 2.54;
  E.profil.taille = Math.min(230, Math.max(120, Math.round(t)));
  const pd = versKg(v("o-poids") || uPoids(E.profil.poidsDepart));
  E.profil.poidsDepart = Math.min(300, Math.max(30, Math.round(pd*10)/10));
  const mg = v("o-mg");
  E.profil.masseGrasse = (mg >= 3 && mg <= 60) ? mg : null;
  if(!Object.keys(E.poids).length) E.poids[aujourdhui()] = E.profil.poidsDepart;
  etapeSuivante();
}
function basculerIntolerance(k){
  E.profil.intolerances = E.profil.intolerances || [];
  const i = E.profil.intolerances.indexOf(k);
  if(i>=0) E.profil.intolerances.splice(i,1); else E.profil.intolerances.push(k);
  rendreEtape();
}
function basculerMateriel(k){
  E.profil.materiel = E.profil.materiel || [];
  const i = E.profil.materiel.indexOf(k);
  if(i>=0) E.profil.materiel.splice(i,1); else E.profil.materiel.push(k);
  PROG_CACHE = null; rendreEtape();
}
function terminerOnboarding(){
  E.profil.configure = true;
  E.profil.dateDebut = aujourdhui();
  PROG_CACHE = null;
  sauver(); fermerFeuille(); ONGLET = "jour"; rendre();
  toast(E.profil.prenom ? "C'est parti, "+E.profil.prenom : "C'est parti");
}

function basculerIntoleranceR(k){
  E.profil.intolerances = E.profil.intolerances || [];
  const i = E.profil.intolerances.indexOf(k);
  if(i>=0) E.profil.intolerances.splice(i,1); else E.profil.intolerances.push(k);
  sauver(); ouvrirReglages(); rendre();
}
function basculerMaterielR(k){
  E.profil.materiel = E.profil.materiel || [];
  const i = E.profil.materiel.indexOf(k);
  if(i>=0) E.profil.materiel.splice(i,1); else E.profil.materiel.push(k);
  PROG_CACHE = null; sauver(); ouvrirReglages(); rendre();
}
function enregistrerReglages(){
  const g = id => { const e = document.getElementById(id); return e ? parseFloat(e.value) : NaN; };
  const p = E.profil;
  p.age = g("r-age") || p.age;
  let t = g("r-taille") || (p.uniteTaille==="in" ? p.taille/2.54 : p.taille);
  p.taille = Math.round(p.uniteTaille==="in" ? t*2.54 : t);
  p.poidsDepart = versKg(g("r-dep") || uPoids(p.poidsDepart));
  const mg = g("r-mg"); p.masseGrasse = (mg >= 3 && mg <= 60) ? mg : null;
  p.sexe = document.getElementById("r-sexe").value;
  p.activite = parseFloat(document.getElementById("r-act").value) || p.activite;
  p.activiteType = document.getElementById("r-actType").value;
  const rp = g("r-prot"), rl = g("r-lip");
  E.reglages.ratioProt = rp > 0 ? rp : null;
  E.reglages.ratioLip  = rl > 0 ? rl : null;
  E.reglages.decalageSem = g("r-dec") || 0;
  PROG_CACHE = null; sauver(); fermerFeuille(); rendre(); toast("Réglages enregistrés");
}

/* ---------- AUJOURD'HUI ---------- */

  else if(sp && !faite)               { phrase = `Calories atteintes. Reste la séance <b class="amb">${esc(sp.seance.n)}</b>.`; couleur = "amber"; }

/* ---------- LA BARRE : largeur pilotée par l'objectif ---------- */
function largeurSemaine(s){
  const dep = E.profil.poidsDepart, o = objectif();
  const r = o.rythme[agressivite()] || [0,0];
  const cible = dep + (r[0]+r[1])/2 * dep * 52;
  const fin = dPlus(E.profil.dateDebut, (s-1)*7 + 6);
  let p = null;
  for(let i=0;i<7 && p===null;i++) p = moyenneMobile(dPlus(fin,-i), 7);
  if(p === null) return 22;
  if(Math.abs(cible - dep) < 0.5) return 60;   // objectif sans changement de poids
  return Math.max(22, Math.min(100, 22 + (p - dep)/(cible - dep)*78));
}

  });
  const parRayon = {};
  Object.keys(total).forEach(ai=>{
    const a = AL(ai); if(!a) return;
    (parRayon[a.r] = parRayon[a.r] || []).push({
      id:ai, nom:a.n, g:Math.round(total[ai]), cout:Math.round(a.prix*total[ai]/1000*100)/100

function courbePoids(){
  const s = serieMoyenneMobile(60).filter(p => p.v !== null || p.brut !== null);
  if(s.length < 2) return `<div class="vide-etat" style="padding:24px 10px"><div class="mini">Pèse-toi six fois pour voir apparaître ta courbe.</div></div>`;
  const W = 320, H = 92, P = 5;
  const vals = s.map(p=>p.v ?? p.brut).filter(v=>v!==null);
  const dep = E.profil.poidsDepart, o = objectif(), r = o.rythme[agressivite()] || [0,0];
  const nJ = s.length, sem = nJ/7;
  const bornes = [dep + r[0]*dep*sem, dep + r[1]*dep*sem];
  let mn = Math.min(...vals, dep, ...bornes) - .6, mx = Math.max(...vals, dep, ...bornes) + .6;
  if(mx - mn < 2){ const c=(mx+mn)/2; mn=c-1; mx=c+1; }
  const X = i => P + i/(s.length-1)*(W-2*P);
  const Y = v => H - P - (v-mn)/(mx-mn)*(H-2*P);

  const pts = s.map((p,i)=>p.v!==null ? [X(i), Y(p.v)] : null).filter(Boolean);
  const ligne = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const aire = pts.length ? ligne+` L${pts[pts.length-1][0].toFixed(1)} ${H-P} L${pts[0][0].toFixed(1)} ${H-P} Z` : "";
  const dots = s.map((p,i)=>p.brut!==null ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.brut).toFixed(1)}" r="1.5" fill="var(--txt-3)"/>` : "").join("");
  const bande = Math.abs(bornes[0]-bornes[1]) > 0.05
    ? `<path d="M${X(0)} ${Y(dep)} L${X(nJ-1)} ${Y(bornes[0])} L${X(nJ-1)} ${Y(bornes[1])} Z" fill="var(--vrt-o)"/>`
    : `<rect x="${P}" y="${Y(dep+dep*0.015).toFixed(1)}" width="${W-2*P}" height="${Math.abs(Y(dep-dep*0.015)-Y(dep+dep*0.015)).toFixed(1)}" fill="var(--vrt-o)"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="none">
    <defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--amb-2)" stop-opacity=".26"/>
      <stop offset="100%" stop-color="var(--amb-2)" stop-opacity="0"/></linearGradient></defs>
    ${bande}
    <line x1="${P}" y1="${Y(dep).toFixed(1)}" x2="${W-P}" y2="${Y(dep).toFixed(1)}" stroke="var(--bord-2)" stroke-width=".7" stroke-dasharray="3 3"/>
    ${aire?`<path d="${aire}" fill="url(#gp)"/>`:""}
    <path d="${ligne}" fill="none" stroke="var(--amb-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

function consignePack(type){
  const TA = tousAliments();
  const dispo = Object.keys(TA).filter(alimentCompatible);
  const listeAl = dispo.map(id => `${id} (${TA[id].n})`).join(" · ");
  const listeFig = Object.keys(FIGURES).join(" · ");
  const listePat = Object.keys(PATRONS).map(k => `${k} = ${PATRONS[k].n}`).join(" · ");
  const c = cibleMacros(), p = E.profil, o = objectif();
  const mat = materielDispo().map(m => MATERIEL[m].n).join(", ");
  const excl = exclusionsProfil().map(t => ETIQUETTES[t]).join(", ");

  const blocRecette = `RECETTE
{"n":"Nom", "m":"matin|midi|soir|shake|collation", "t":minutes, "mix":true si un mixeur est nécessaire,
 "ing":[["identifiantAliment", grammes], ...], "et":["étape 1","étape 2"], "as":"une astuce utile"}
N'écris JAMAIS les calories, les macros ou le prix : l'application les calcule à partir des grammages.
Grammages en grammes de produit cru, entre 1 et 2000.`;

  const blocExo = `EXERCICE
{"n":"Nom", "pat":"un patron de la liste", "niv":1|2|3, "repos":secondes, "tempo":"3-1-X",
 "mus":["Pectoraux","Triceps"], "mat":["Chaise"], "uni":true si unilatéral, "lest":true si lesté,
 "exec":["étape 1","étape 2","étape 3"], "err":["erreur fréquente 1","erreur 2"],
 "fig":"identifiant de figure", "note":"remarque optionnelle"}
Patrons acceptés : ${listePat}
"exec" : minimum 2 étapes. "err" : minimum 1 erreur.
"fig" est facultatif — choisis la figure existante la plus proche du mouvement, ou omets le champ.
Figures disponibles : ${listeFig}`;

  const blocAliment = `ALIMENT — uniquement si un ingrédient nécessaire n'existe pas dans la liste
{"id":"identifiantSansAccentNiEspace", "n":"Nom lisible",
 "r":"Épicerie|Frais|Boucherie|Conserves|Fruits & légumes|Surgelés|Compléments",
 "k":kcal pour 100 g, "p":protéines, "g":glucides, "l":lipides, "prix":euros par kilo}
Place les aliments AVANT les recettes qui les utilisent.`;

  const sections = type === "recettes" ? [blocRecette, blocAliment]
                 : type === "exercices" ? [blocExo]
                 : [blocRecette, blocExo, blocAliment];

  return `Tu vas produire un « pack » au format JSON pour mon application de suivi sportif.

RÈGLE ABSOLUE
Réponds uniquement par le JSON. Aucun texte avant, aucun texte après, aucune balise de code.

STRUCTURE
{"pack":"nom court du pack", "recettes":[...], "exercices":[...], "aliments":[...]}
Les trois sections sont facultatives : ne mets que celles qui sont demandées.

${sections.join("\n\n")}

${type !== "exercices" ? `IDENTIFIANTS D'ALIMENTS DISPONIBLES ET COMPATIBLES AVEC MON RÉGIME
${listeAl}

` : ""}MON PROFIL
${p.sexe === "h" ? "Homme" : "Femme"}, ${p.age} ans, ${p.taille} cm, ${poidsActuel().toFixed(1)} kg.
Objectif : ${o.n.toLowerCase()} (${AGRESSIVITE[p.agressivite].n.toLowerCase()}).
Cible ${c.kcal} kcal par jour, ${c.prot} g de protéines, ${c.lip} g de lipides, ${c.gluc} g de glucides.
Régime : ${REGIMES[p.regime].n.toLowerCase()}${excl ? ". À exclure absolument : " + excl.toLowerCase() : ""}.
${(p.exclusions||[]).length ? "Aliments que je ne mange pas : " + p.exclusions.map(x=>(AL(x)||{n:x}).n).join(", ") + ".\n" : ""}Matériel d'entraînement : ${mat}. ${p.frequence} séances par semaine, niveau ${NIVEAUX_N[p.niveau].toLowerCase()}.
${p.activiteType !== "aucune" ? "Activité quotidienne : " + ACTIVITES_HORAIRES[p.activiteType].n.toLowerCase() + ".\n" : ""}
CE QUE JE VEUX
[Écris ici ta demande. Par exemple : « 8 dîners de moins de 20 minutes et moins de 2 € »,
 « des recettes très rassasiantes pour une période de perte de gras »,
 « 5 variantes de tractions pour progresser vers la traction lestée ».]`;
}

function basculerMachine(m){
  const act = machinesActives().slice();
  const i = act.indexOf(m);
  if(i >= 0) act.splice(i, 1); else act.push(m);
  E.profil.machines = act;
  PROG_CACHE = null; sauver(); ouvrirMachines();
}
function cocherZone(z, tout){
  const act = machinesActives().slice();
  machinesZone(z).forEach(m=>{
    const i = act.indexOf(m);
    if(tout && i < 0) act.push(m);
    if(!tout && i >= 0) act.splice(i, 1);
  });
  E.profil.machines = act; PROG_CACHE = null; sauver(); ouvrirMachines();
}
function toutesMachines(tout){
  E.profil.machines = tout ? Object.keys(MACHINES) : [];
  PROG_CACHE = null; sauver(); ouvrirMachines();
}
function machinesDefaut(){
  E.profil.machines = machinesParDefaut();
  PROG_CACHE = null; sauver(); ouvrirMachines();
}

function ouvrirRemplacement(idOrigine){

  const choix = Object.keys(T).filter(k => T[k].pat === base.pat && exoDispo(k));

  feuille(`

    ${choix.length ? choix.map(k=>{
      const x = T[k], on = k === actuel;
      return `<div class="ligne" onclick="choisirRemplacement('${idOrigine}','${k}')">
        <div class="coche ${on?"on":""}" style="flex:none">✓</div>
        <div class="corps"><div class="titre">${esc(x.n)}</div>
          <div class="det" style="font-family:var(--sans)">${NIV_TXT[x.niv]} · ${x.mat.join(", ") || "poids du corps"}</div></div></div>`;
    }).join("") : `<div class="vide-etat"><div class="g">◇</div><div class="mini">Aucune machine cochée ne couvre ce mouvement.<br>Ajoute des machines pour avoir le choix.</div></div>`}
    <button class="btn fant large" style="margin-top:13px" onclick="fermerFeuille();ouvrirMachines()">Modifier mes machines</button>`);
}
function choisirRemplacement(idOrigine, nouveau){
  E.remplacements = E.remplacements || {};
  if(nouveau === idOrigine) delete E.remplacements[idOrigine];
  else E.remplacements[idOrigine] = nouveau;
  sauver(); fermerFeuille(); rendre();
  toast("Exercice remplacé");
}

  if(FILTRE_BIB === "dispo") ids = ids.filter(exoDispo);
  else if(FILTRE_BIB !== "tous") ids = ids.filter(k => T[k].pat === FILTRE_BIB);
  ids.sort((a,b)=>(T[a].pat).localeCompare(T[b].pat) || T[a].niv - T[b].niv);

  feuille(`
    <h2 style="margin-bottom:5px">Bibliothèque</h2>
    <p class="sub">${Object.keys(T).length} exercices, dont ${Object.keys(T).filter(exoDispo).length} réalisables avec tes machines. Chaque fiche montre le mouvement en trois dimensions : fais glisser pour tourner autour.</p>
    <div class="chips" style="flex-wrap:wrap">
      <button class="chip ${FILTRE_BIB==="tous"?"on":""}" onclick="FILTRE_BIB='tous';ouvrirGalerie()">Tous</button>
      <button class="chip ${FILTRE_BIB==="dispo"?"on v":""}" onclick="FILTRE_BIB='dispo';ouvrirGalerie()">Mes machines</button>
      ${Object.keys(PATRONS).map(p=>`<button class="chip ${FILTRE_BIB===p?"on":""}" onclick="FILTRE_BIB='${p}';ouvrirGalerie()">${PATRONS[p].n}</button>`).join("")}
    </div>
    ${ids.map(k=>{
      const x = T[k], pat = PATRONS[x.pat]||{c:"amber",n:""}, ok = exoDispo(k);
      return `<div class="ligne" onclick="ouvrirExo('${k}')" style="${ok?"":"opacity:.5"}">
        ${figDe(k) ? `<div class="fg-${pat.c}" style="flex:none;width:64px">${figureSVG(k, false)}</div>` : `<div class="puce ${pat.c}">◇</div>`}
        <div class="corps"><div class="titre">${esc(x.n)}</div>
          <div class="det" style="font-family:var(--sans)">${esc(x.zone)} · ${NIV_TXT[x.niv]}${ok?"":" · machine non cochée"}</div></div>
        <span class="t3">›</span></div>`;
    }).join("")}`);
  setTimeout(animer3D, 30);
}
/* ============================================================
   PROFILS — plusieurs personnes sur le même appareil
   Chaque profil a ses réglages, son poids, ses séances, ses
   repas et son programme. Rien n'est partagé entre eux.
   ============================================================ */
const CLE_INDEX  = "charge-profils";
const CLE_ACTIF  = "charge-actif";
const CLE_DONNEES = id => "charge-donnees-" + id;

function listeProfils(){
  try{ const b = Store.get(CLE_INDEX); return b ? JSON.parse(b) : []; }
  catch(e){ return []; }
}
function ecrireIndex(l){ Store.set(CLE_INDEX, JSON.stringify(l)); }
function profilActifId(){ return Store.get(CLE_ACTIF); }

function nouvelId(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

/* Reprise de l'ancienne sauvegarde à profil unique */
function migrerVersProfils(){
  if(listeProfils().length) return;
  const ancien = Store.get(CLE);
  const id = nouvelId();
  let nom = "Moi";
  if(ancien){
    try{ const d = JSON.parse(ancien); if(d.profil && d.profil.prenom) nom = d.profil.prenom; }catch(e){}
    Store.set(CLE_DONNEES(id), ancien);
  }
  ecrireIndex([{id, nom, cree: aujourdhui()}]);
  Store.set(CLE_ACTIF, id);
}

function creerProfil(nom){
  const id = nouvelId();
  const l = listeProfils();
  l.push({id, nom: (nom||"Nouveau profil").trim().slice(0,20) || "Nouveau profil", cree: aujourdhui()});
  ecrireIndex(l);
  Store.set(CLE_DONNEES(id), JSON.stringify(ETAT_VIDE));
  return id;
}
function renommerProfil(id, nom){
  const l = listeProfils();
  const p = l.find(x => x.id === id);
  if(p){ p.nom = (nom||"").trim().slice(0,20) || p.nom; ecrireIndex(l); }
}
function supprimerProfil(id){
  const l = listeProfils().filter(x => x.id !== id);
  ecrireIndex(l);
  Store.del(CLE_DONNEES(id));
  if(profilActifId() === id && l.length) basculerProfil(l[0].id);
}
function basculerProfil(id){
  sauver();
  Store.set(CLE_ACTIF, id);
  PROG_CACHE = null;
  charger();
  fermerFeuille(); ONGLET = "jour"; rendre();
  const p = listeProfils().find(x => x.id === id);
  toast(p ? "Profil " + p.nom : "Profil changé");
}
function nomProfilActif(){
  const p = listeProfils().find(x => x.id === profilActifId());
  return p ? p.nom : "Moi";
}

/* ------------------------------------------------------------
   Sauvegarde et chargement, redirigés vers le profil actif
   ------------------------------------------------------------ */
function sauver(){
  try{
    const id = profilActifId();
    if(id) Store.set(CLE_DONNEES(id), JSON.stringify(E));
    else Store.set(CLE, JSON.stringify(E));
  }catch(e){}
}
function charger(){
  Store.init();
  migrerVersProfils();
  const id = profilActifId();
  let brut = id ? Store.get(CLE_DONNEES(id)) : Store.get(CLE);
  E = JSON.parse(JSON.stringify(ETAT_VIDE));
  if(brut){
    try{
      const d = JSON.parse(brut);
      Object.keys(ETAT_VIDE).forEach(k=>{
        if(d[k] === undefined) return;
        if(k === "profil" || k === "reglages") Object.assign(E[k], d[k]);
        else E[k] = d[k];
      });
    }catch(e){}
  }
  /* Reprise des anciens profils : le matériel devient une sélection de machines */
  if(E.profil.machines === undefined || E.profil.machines === null){
    if(Array.isArray(E.profil.materiel) && E.profil.configure){
      const map = {halteres:["halteres","bancPlat","bancIncline"], barre:["barreOlymp","barreEz","cageSquat"],
                   banc:["bancPlat","bancIncline"], salle:machinesParDefaut(),
                   barreTraction:["barreTraction"], elastique:["elastiques"], sac:[]};
      const s = new Set(["tapisSol"]);
      E.profil.materiel.forEach(m => (map[m]||[]).forEach(x => s.add(x)));
      E.profil.machines = s.size > 1 ? Array.from(s) : machinesParDefaut();
    } else {
      E.profil.machines = machinesParDefaut();
    }
  }
  /* Un profil neuf n'a pas encore de date de début : sans elle,
     tous les calculs de semaine échouent dès le premier rendu. */
  if(!E.profil.dateDebut) E.profil.dateDebut = aujourdhui();
  PROG_CACHE = null;
}

/* ------------------------------------------------------------
   Écran de gestion des profils
   ------------------------------------------------------------ */
function ouvrirProfils(){
  const l = listeProfils(), actif = profilActifId();
  feuille(`
    <h2 style="margin-bottom:5px">Profils</h2>
    <p class="sub">Chaque personne a ses propres réglages, son poids, ses séances et son programme. Rien n'est partagé. Tout reste sur cet appareil.</p>

    ${l.map(p=>{
      const on = p.id === actif;
      let resume = "";
      try{
        const d = JSON.parse(Store.get(CLE_DONNEES(p.id)) || "{}");
        const o = d.profil && OBJECTIFS[d.profil.objectif];
        const nS = Object.keys(d.seances||{}).length;
        resume = (o ? o.n : "Non configuré") + (nS ? " · " + nS + " séance" + (nS>1?"s":"") : "");
      }catch(e){ resume = "—"; }
      return `<div class="carte ${on?"amber":""}" style="${on?"outline:1.5px solid var(--amb-2)":""}">
        <div class="carte-tete">
          <div style="min-width:0">
            <h3>${esc(p.nom)}${on?' <span class="pillule amber">actif</span>':""}</h3>
            <div class="mini" style="margin-top:3px">${esc(resume)}</div>
          </div>
        </div>
        <div class="btn-rangee">
          ${on ? `<button class="btn fant" style="flex:1;pointer-events:none;opacity:.5">Profil en cours</button>`
               : `<button class="btn plein" style="flex:1" onclick="basculerProfil('${p.id}')">Utiliser</button>`}
          <button class="btn fant" onclick="ouvrirRenommer('${p.id}')">Renommer</button>
          ${l.length > 1 ? `<button class="btn fant" style="color:var(--ros-2)" onclick="confirmerSuppression('${p.id}')">✕</button>` : ""}
        </div>
      </div>`;
    }).join("")}

    <div class="carte green">
      <div class="eyebrow vrt" style="margin-bottom:7px">Nouveau profil</div>
      <label style="margin-bottom:9px"><span>Prénom</span><input id="np-nom" style="font-family:var(--sans)" placeholder="Qui va utiliser l'app ?"></label>
      <button class="btn vert large" onclick="creerEtBasculer()">Créer et configurer</button>
      <div class="mini" style="margin-top:8px">Le questionnaire de configuration s'ouvrira pour cette personne.</div>
    </div>

    <div class="mini" style="margin-top:6px;padding-top:13px;border-top:1px solid var(--bord)">
      Supprimer un profil efface définitivement ses données, sans possibilité de retour. Exporte-les avant si tu veux les garder.
    </div>`);
}
function creerEtBasculer(){
  const e = document.getElementById("np-nom");
  const nom = e ? e.value : "";
  const id = creerProfil(nom);
  sauver();
  Store.set(CLE_ACTIF, id);
  PROG_CACHE = null;
  charger();
  E.profil.prenom = (nom||"").trim().slice(0,20);
  fermerFeuille(); ONGLET = "jour"; rendre();
  setTimeout(()=>ouvrirOnboarding(0), 140);
}
function ouvrirRenommer(id){
  const p = listeProfils().find(x => x.id === id); if(!p) return;
  feuille(`
    <h2 style="margin-bottom:13px">Renommer</h2>
    <label><span>Prénom</span><input id="rn-nom" value="${esc(p.nom)}" style="font-family:var(--sans)"></label>
    <button class="btn plein large" onclick="validerRenommage('${id}')">Enregistrer</button>
    <button class="btn fant large" style="margin-top:8px" onclick="ouvrirProfils()">Annuler</button>`);
}
function validerRenommage(id){
  const e = document.getElementById("rn-nom");
  renommerProfil(id, e ? e.value : "");
  if(id === profilActifId()){ E.profil.prenom = (e ? e.value : "").trim().slice(0,20); sauver(); }
  ouvrirProfils(); rendre(); toast("Renommé");
}
function confirmerSuppression(id){
  const p = listeProfils().find(x => x.id === id); if(!p) return;
  feuille(`
    <h2 style="margin-bottom:5px">Supprimer ${esc(p.nom)} ?</h2>
    <p class="sub">Toutes les données de ce profil seront effacées : poids, séances, repas, programme. C'est définitif.</p>
    <button class="btn large" style="background:var(--ros-o);border-color:var(--ros-3);color:var(--ros-1)" onclick="supprimerEtRevenir('${id}')">Supprimer définitivement</button>
    <button class="btn fant large" style="margin-top:8px" onclick="ouvrirProfils()">Annuler</button>`);
}
function supprimerEtRevenir(id){
  const etaitActif = id === profilActifId();
  supprimerProfil(id);
  if(etaitActif){ charger(); rendre(); }
  ouvrirProfils(); toast("Profil supprimé");
}
/* ============================================================
   DÉMARRAGE
   ============================================================ */
charger();
if(!E.profil.configure && !Object.keys(E.poids).length && !Object.keys(E.seances).length){
  rendre();
  setTimeout(()=>ouvrirOnboarding(0), 120);
} else {
  if(!E.profil.configure) E.profil.configure = true;
  rendre();
}
if(!Store.ok){
  setTimeout(()=>toast("Aperçu : les données ne seront pas conservées"), 900);
}
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && MIN.wake === null && MIN.h) verrouEcran(true); });
brancherRotation();
</script>
