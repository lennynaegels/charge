<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0D14">
<meta name="description" content="Suivi de prise de masse à domicile : programme 52 semaines, recettes, courses et analyse.">
<link rel="manifest" href="manifest.webmanifest">
<title>Charge — prise de masse 52 semaines</title>
<style>
/* ============================================================
   PALETTE — une nuit de livraison : bitume mouillé, lampadaires
   sodium, feu vert, phare de vélo.
   ============================================================ */
:root{
  --nuit-0:#0A0D14; --nuit-1:#0F131C; --nuit-2:#161B26; --nuit-3:#1E2532; --nuit-4:#252E3D;
  --bord:#2A3340; --bord-2:#3A4553;
  --txt:#EDF1F6; --txt-2:#96A2B3; --txt-3:#626E7E;

  --amb-1:#FFC46B; --amb-2:#FFAE3D; --amb-3:#F08519; --amb-4:#B85F0C; --amb-o:rgba(255,174,61,.13);
  --vrt-1:#7EE8A8; --vrt-2:#4ADE80; --vrt-3:#22C55E; --vrt-4:#15803D; --vrt-o:rgba(74,222,128,.12);
  --blu-1:#A5DDFC; --blu-2:#7DD3FC; --blu-3:#38BDF8; --blu-4:#0284C7; --blu-o:rgba(56,189,248,.12);
  --vio-1:#D5C8FF; --vio-2:#B9A4FB; --vio-3:#8B5CF6; --vio-4:#6D28D9; --vio-o:rgba(139,92,246,.13);
  --ros-1:#FFA8B0; --ros-2:#FB7185; --ros-3:#E11D48; --ros-o:rgba(251,113,133,.12);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-s:9px;
  --pad:16px;
  --nav-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--nuit-0);
  background-image:
    radial-gradient(1100px 480px at 82% -12%, rgba(255,174,61,.075), transparent 62%),
    radial-gradient(820px 420px at 8% 102%, rgba(56,189,248,.06), transparent 60%);
  background-attachment:fixed;
  color:var(--txt); font-family:var(--sans);
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;padding:0 var(--pad)}

/* ---------- Typographie ---------- */
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.022em;line-height:1.2}
h1{font-size:25px} h2{font-size:19px} h3{font-size:15.5px} h4{font-size:13.5px}
p{margin:0 0 10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.eyebrow{
  font-family:var(--mono);font-size:9.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.15em;color:var(--txt-3);
}
.sub{color:var(--txt-2);font-size:13px;line-height:1.5}
.mini{color:var(--txt-3);font-size:11.5px;line-height:1.45}
.amb{color:var(--amb-2)} .vrt{color:var(--vrt-2)} .blu{color:var(--blu-2)}
.vio{color:var(--vio-2)} .ros{color:var(--ros-2)} .t2{color:var(--txt-2)} .t3{color:var(--txt-3)}

/* ---------- En-tête ---------- */
header{padding:calc(env(safe-area-inset-top) + 18px) 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.marque{display:flex;flex-direction:column;gap:3px}
.marque .nom{font-size:16px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.pastille{width:9px;height:9px;border-radius:3px;background:linear-gradient(150deg,var(--amb-1),var(--amb-4));box-shadow:0 0 11px var(--amb-o)}
.btn-reglages{
  background:var(--nuit-2);border:1px solid var(--bord);color:var(--txt-2);
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px
}
.btn-reglages:active{background:var(--nuit-3)}

/* ---------- Cartes ---------- */
.carte{
  background:linear-gradient(180deg,var(--nuit-2),var(--nuit-1));
  border:1px solid var(--bord); border-radius:var(--r);
  padding:15px; margin-bottom:12px; position:relative; overflow:hidden;
}
.carte::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--bord)}
.carte.amber::before{background:linear-gradient(90deg,var(--amb-3),var(--amb-1),transparent 88%)}
.carte.green::before{background:linear-gradient(90deg,var(--vrt-4),var(--vrt-2),transparent 88%)}
.carte.blue::before {background:linear-gradient(90deg,var(--blu-4),var(--blu-2),transparent 88%)}
.carte.violet::before{background:linear-gradient(90deg,var(--vio-4),var(--vio-2),transparent 88%)}
.carte.rose::before{background:linear-gradient(90deg,var(--ros-3),var(--ros-1),transparent 88%)}
.carte-tete{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}

/* ---------- Boutons ---------- */
.btn{
  font-family:var(--sans);font-size:14px;font-weight:650;
  background:var(--nuit-3);color:var(--txt);
  border:1px solid var(--bord-2);border-radius:11px;
  padding:11px 15px;cursor:pointer;transition:transform .06s,background .13s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:active{transform:scale(.975)}
.btn.plein{background:linear-gradient(160deg,var(--amb-2),var(--amb-4));border-color:var(--amb-3);color:#1A1206;font-weight:750}
.btn.vert{background:linear-gradient(160deg,var(--vrt-2),var(--vrt-4));border-color:var(--vrt-3);color:#04180C;font-weight:750}
.btn.bleu{background:linear-gradient(160deg,var(--blu-3),var(--blu-4));border-color:var(--blu-3);color:#04121C;font-weight:750}
.btn.large{width:100%}
.btn.mini{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.fant{background:transparent;border-color:var(--bord)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-rangee{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Champs ---------- */
input,select,textarea{
  font-family:var(--mono);font-size:15px;
  background:var(--nuit-0);color:var(--txt);
  border:1px solid var(--bord);border-radius:10px;padding:10px 11px;width:100%;
}
input:focus,select,textarea:focus{outline:2px solid var(--amb-3);outline-offset:1px}
select{font-family:var(--sans);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);background-position:calc(100% - 16px) 51%,calc(100% - 11px) 51%;background-size:5px 5px;background-repeat:no-repeat}
label{display:block;margin-bottom:14px}
label>span{display:block;margin-bottom:5px;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--txt-3)}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grille3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

/* ---------- Anneau de calories ---------- */
.anneau-bloc{display:flex;align-items:center;gap:16px}
.anneau{
  --p:0; --c1:var(--amb-2); --c2:var(--amb-4);
  width:106px;height:106px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from -90deg, var(--c1) 0turn, var(--c2) calc(var(--p)*1turn), var(--nuit-3) calc(var(--p)*1turn) 1turn);
  display:grid;place-items:center;
  transition:--p .5s;
}
.anneau::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--nuit-1)}
.anneau-txt{position:relative;z-index:1;text-align:center;line-height:1.05}
.anneau-txt .g{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.04em}
.anneau-txt .p{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--txt-3);margin-top:3px}

/* ---------- Barres de macros ---------- */
.macro{margin-bottom:9px}
.macro:last-child{margin-bottom:0}
.macro-tete{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.macro-tete .n{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--txt-3)}
.macro-tete .v{font-family:var(--mono);font-size:12px;font-weight:600}
.jauge{height:5px;border-radius:3px;background:var(--nuit-3);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:3px;transition:width .4s}

/* ---------- La barre : 52 semaines ---------- */
.barre-an{display:flex;flex-direction:column-reverse;gap:2px;padding:4px 0}
.sem{
  height:8px;border-radius:2px;position:relative;
  background:var(--nuit-3);border:1px solid transparent;
  transition:width .35s, background .25s;
}
.sem.futur{background:transparent;border:1px dashed var(--bord);opacity:.45}
.sem.vide{background:var(--nuit-3)}
.sem.partiel{background:linear-gradient(90deg,var(--amb-4),var(--amb-2))}
.sem.plein{background:linear-gradient(90deg,var(--vrt-4),var(--vrt-2))}
.sem.deload{background:linear-gradient(90deg,var(--blu-4),var(--blu-2))}
.sem.now{box-shadow:0 0 0 1px var(--amb-2),0 0 13px var(--amb-o)}
.barre-compacte{display:flex;gap:1.5px;align-items:flex-end;height:34px}
.barre-compacte i{flex:1;border-radius:1.5px;background:var(--nuit-3);min-height:4px}
.barre-legende{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px}
.lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--txt-3)}
.lg b{width:9px;height:9px;border-radius:2px;display:block}

/* ---------- Listes ---------- */
.ligne{
  display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--bord);cursor:pointer;
}
.ligne:last-child{border-bottom:none}
.ligne .corps{flex:1;min-width:0}
.ligne .titre{font-weight:640;font-size:14px;letter-spacing:-.012em}
.ligne .det{font-size:11.5px;color:var(--txt-3);margin-top:2px;font-family:var(--mono)}
.puce{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700}
.puce.amber{background:var(--amb-o);color:var(--amb-2)}
.puce.green{background:var(--vrt-o);color:var(--vrt-2)}
.puce.blue{background:var(--blu-o);color:var(--blu-2)}
.puce.violet{background:var(--vio-o);color:var(--vio-2)}
.puce.rose{background:var(--ros-o);color:var(--ros-2)}

.coche{
  width:25px;height:25px;border-radius:8px;flex:none;
  border:1.5px solid var(--bord-2);display:grid;place-items:center;
  font-size:13px;color:transparent;transition:.15s;background:var(--nuit-0)
}
.coche.on{background:linear-gradient(160deg,var(--vrt-2),var(--vrt-4));border-color:var(--vrt-3);color:#04180C}
.fait .titre{color:var(--txt-3);text-decoration:line-through;text-decoration-color:var(--vrt-4)}

/* ---------- Chips / segments ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:var(--nuit-2);border:1px solid var(--bord);color:var(--txt-2);cursor:pointer;white-space:nowrap
}
.chip.on{background:var(--amb-o);border-color:var(--amb-3);color:var(--amb-1)}
.chip.on.v{background:var(--vio-o);border-color:var(--vio-3);color:var(--vio-1)}

/* ---------- Constats d'analyse ---------- */
.constat{border-left:3px solid var(--bord);padding:12px 0 12px 13px;margin-bottom:13px}
.constat:last-child{margin-bottom:0}
.constat.ok{border-color:var(--vrt-3)}
.constat.action{border-color:var(--amb-3)}
.constat.alerte{border-color:var(--ros-3)}
.constat.info{border-color:var(--blu-3)}
.constat h4{margin-bottom:5px;font-size:14px}
.constat p{font-size:13px;color:var(--txt-2);margin:0;line-height:1.55}
.constat .btn{margin-top:10px}

/* ---------- Exercice en séance ---------- */
.serie{
  display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:7px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--nuit-3)
}
.serie:last-of-type{border-bottom:none}
.serie .idx{font-family:var(--mono);font-size:11px;color:var(--txt-3);text-align:center}
.serie input{padding:8px 6px;text-align:center;font-size:14px;border-radius:8px}
.serie .ok{
  width:32px;height:32px;border-radius:9px;border:1.5px solid var(--bord-2);
  background:var(--nuit-0);display:grid;place-items:center;color:transparent;font-size:14px;cursor:pointer
}
.serie .ok.on{background:linear-gradient(160deg,var(--vrt-2),var(--vrt-4));border-color:var(--vrt-3);color:#04180C}
.entete-serie{display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:7px;margin-bottom:3px}
.entete-serie span{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--txt-3);text-align:center}

/* ---------- Minuteur plein écran ---------- */
#minuteur{
  position:fixed;inset:0;z-index:60;background:rgba(8,11,17,.975);backdrop-filter:blur(9px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:26px
}
#minuteur.on{display:flex}
.cadran{
  --p:1;width:min(70vw,270px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(from -90deg,var(--amb-2) 0turn,var(--amb-4) calc(var(--p)*1turn),var(--nuit-2) calc(var(--p)*1turn) 1turn);
}
.cadran::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--nuit-0)}
.cadran-txt{position:relative;z-index:1;text-align:center}
.cadran-txt .t{font-family:var(--mono);font-size:54px;font-weight:700;letter-spacing:-.05em;line-height:1}
.cadran-txt .l{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--txt-3);margin-top:7px}
.tempo-bulle{
  width:min(56vw,210px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--amb-3);transition:transform .1s linear;
  font-family:var(--mono);font-size:16px;font-weight:700;color:var(--amb-1);text-transform:uppercase;letter-spacing:.1em
}

/* ---------- Feuille modale ---------- */
#feuille{position:fixed;inset:0;z-index:50;display:none}
#feuille.on{display:block}
.voile{position:absolute;inset:0;background:rgba(5,7,11,.72);backdrop-filter:blur(3px)}
.panneau{
  position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;
  background:var(--nuit-1);border-top:1px solid var(--bord);
  border-radius:20px 20px 0 0;padding:18px var(--pad) calc(26px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
  animation:monte .24s cubic-bezier(.22,1,.36,1);
}
@keyframes monte{from{transform:translateY(100%)}to{transform:translateY(0)}}
.poignee{width:34px;height:4px;border-radius:2px;background:var(--bord-2);margin:0 auto 15px}

/* ---------- Navigation ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(12,16,23,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--bord);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
  max-width:560px;margin:0 auto;
}
nav button{
  flex:1;background:none;border:none;color:var(--txt-3);cursor:pointer;
  padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;
  border-top:2px solid transparent;margin-top:-1px;transition:color .15s
}
nav button svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--amb-2);border-top-color:var(--amb-2)}

/* ---------- Divers ---------- */
.vide-etat{text-align:center;padding:34px 16px;color:var(--txt-3)}
.vide-etat .g{font-size:30px;margin-bottom:9px;opacity:.6}
.pillule{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600
}
.pillule.amber{background:var(--amb-o);color:var(--amb-2)}
.pillule.green{background:var(--vrt-o);color:var(--vrt-2)}
.pillule.blue{background:var(--blu-o);color:var(--blu-2)}
.pillule.violet{background:var(--vio-o);color:var(--vio-2)}
.pillule.rose{background:var(--ros-o);color:var(--ros-2)}
.pillule.gris{background:var(--nuit-3);color:var(--txt-3)}
.sep{height:1px;background:var(--bord);margin:14px 0}
.notes{list-style:none;padding:0;margin:0}
.notes li{position:relative;padding-left:17px;margin-bottom:7px;font-size:13px;color:var(--txt-2);line-height:1.5}
.notes li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:2px;background:var(--amb-3)}
.notes.ros li::before{background:var(--ros-3)}
.notes.vrt li::before{background:var(--vrt-3)}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:70;
  background:var(--nuit-3);border:1px solid var(--bord-2);border-radius:11px;
  padding:10px 16px;font-size:13px;font-weight:600;
  box-shadow:0 8px 26px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* ---------- Figures d'exercice ---------- */
.fig{width:100%;height:auto;display:block}
.f-sol{stroke:var(--bord-2);stroke-width:1;stroke-linecap:round}
.f-prop{fill:var(--nuit-4);stroke:var(--bord-2);stroke-width:.7}
.f-prop-l{stroke:var(--bord-2);stroke-width:1.5;stroke-linecap:round}
.f-loin{opacity:.3}
.f-b2,.f-j2{fill:none;stroke:var(--txt-2);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.f-torse{stroke:var(--amb-2);stroke-width:5.4;stroke-linecap:round}
.f-cou{stroke:var(--amb-2);stroke-width:3.4;stroke-linecap:round}
.f-b1,.f-j1{fill:none;stroke:var(--amb-2);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.f-tete{fill:var(--amb-1)}
.fig-boite{
  border-radius:12px;padding:9px 4px;overflow:hidden;position:relative;
  background:radial-gradient(78% 96% at 50% 34%, var(--nuit-3), var(--nuit-0) 76%);
  border:1px solid var(--bord);
}
.fig-boite.mini{padding:3px 0;border-radius:9px;width:74px;flex:none}
.fig-boite .etiq{position:absolute;top:7px;left:9px;font-family:var(--mono);font-size:8.5px;
  text-transform:uppercase;letter-spacing:.14em;color:var(--txt-3)}
.fg-green .f-torse,.fg-green .f-cou,.fg-green .f-b1,.fg-green .f-j1{stroke:var(--vrt-2)}
.fg-green .f-tete{fill:var(--vrt-1)}
.fg-blue .f-torse,.fg-blue .f-cou,.fg-blue .f-b1,.fg-blue .f-j1{stroke:var(--blu-2)}
.fg-blue .f-tete{fill:var(--blu-1)}
.fg-violet .f-torse,.fg-violet .f-cou,.fg-violet .f-b1,.fg-violet .f-j1{stroke:var(--vio-2)}
.fg-violet .f-tete{fill:var(--vio-1)}
.galerie{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.galerie .case{cursor:pointer}
.galerie .nom{font-size:10px;line-height:1.25;font-weight:600;color:var(--txt-2);
  margin-top:5px;text-align:center;min-height:25px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--amb-2);outline-offset:2px}

/* ---------- Figures 3D ---------- */
.f3-boite{position:relative;background:var(--nuit-2);border:1px solid var(--bord);border-radius:14px;
  padding:6px;overflow:hidden;touch-action:none;cursor:grab}
.f3-boite:active{cursor:grabbing}
.f3-boite.mini{border-radius:11px;padding:2px;cursor:pointer;touch-action:auto}
.f3{width:100%;height:auto;display:block}
.f3-sol ellipse{fill:var(--nuit-3);opacity:.5}
.f3-tronc{fill:var(--amb-2);stroke:none}

   STOCKAGE — localStorage avec repli mémoire

/* ============================================================
   MOTEUR 3D — squelette articulé
   Chaque pose est décrite par des ANGLES d'articulation, pas par
   des coordonnées. La cinématique directe calcule les positions
   en trois dimensions, puis on projette à l'écran sous l'angle
   choisi. L'utilisateur fait tourner la figure au doigt.
   Aucune bibliothèque externe : tout tient en quelques kilo-octets.
   ============================================================ */

/* Longueurs de segments, en unités de la scène (≈ cm sur un corps de 175 cm) */
const OS = {
  bassin: 9,    // demi-largeur du bassin
  torse:  22,   // bassin → base du cou
  epaule: 9,    // demi-largeur des épaules
  cou:    4,
  tete:   5,    // rayon du crâne
  bras:   13,   // épaule → coude
  avbras: 12,   // coude → poignet
  cuisse: 19,   // hanche → genou
  tibia:  19,   // genou → cheville
  pied:   6
};

const RAD = Math.PI / 180;
const SOL = -(OS.cuisse + OS.tibia);   // niveau du sol quand on est debout

/* ------------------------------------------------------------
   Cinématique directe.
   Convention : x = droite, y = haut, z = vers l'observateur.
   Un angle de 0° signifie « segment dans l'axe du parent ».
   ------------------------------------------------------------ */
function squelette(p){
  const o = Object.assign({
    x:0, y:0, z:0,          // position du bassin
    inclinaison:0,          // bascule de tout le corps (0 debout, 90 allongé sur le dos)
    torse:0,                // flexion du buste vers l'avant
    torseLat:0,             // inclinaison latérale du buste
    tete:0,                 // flexion de la nuque
    // bras : elevation = vers l'avant/haut, ecart = sur le côté, coude = flexion
    epauleG:0, epauleD:0, ecartG:7, ecartD:7, coudeG:0, coudeD:0, rotG:0, rotD:0,
    // jambes : hanche = flexion, genou = flexion, ouverture = écartement latéral
    hancheG:0, hancheD:0, genouG:0, genouD:0, ouvG:0, ouvD:0,
    chevilleG:0, chevilleD:0
  }, p);

  /* Rotation d'un vecteur autour des axes, dans l'ordre Z (latéral) puis X (sagittal) */
  const dir = (sagittal, lateral) => {
    const s = sagittal*RAD, l = lateral*RAD;
    return [Math.sin(l), -Math.cos(s)*Math.cos(l), Math.sin(s)*Math.cos(l)];
  };
  const av = (pt, d, L) => [pt[0]+d[0]*L, pt[1]+d[1]*L, pt[2]+d[2]*L];
  const neg = d => [-d[0], d[1], d[2]];

  const J = {};
  J.bassin = [o.x, o.y, o.z];

  /* Torse : il part du bassin vers le HAUT, donc on inverse la composante y */
  const dTorse = (() => { const d = dir(o.torse, o.torseLat); return [d[0], -d[1], d[2]]; })();
  J.cou  = av(J.bassin, dTorse, OS.torse);

  const dTete = (() => { const d = dir(o.torse + o.tete, o.torseLat); return [d[0], -d[1], d[2]]; })();
  J.tete = av(J.cou, dTete, OS.cou + OS.tete);

  /* Épaules et hanches : décalées latéralement, perpendiculairement au torse */
  const lat = [Math.cos(o.torseLat*RAD), Math.sin(o.torseLat*RAD), 0];
  J.epauleG = av(J.cou,    neg(lat), OS.epaule);
  J.epauleD = av(J.cou,    lat,      OS.epaule);
  J.hancheG = av(J.bassin, neg(lat), OS.bassin);
  J.hancheD = av(J.bassin, lat,      OS.bassin);

  /* Bras. 0° = le long du corps, 180° = tendu au-dessus de la tête. */
  [["G",-1],["D",1]].forEach(([c, s])=>{
    const elev = o["epaule"+c], ecart = o["ecart"+c]*s, fl = o["coude"+c];
    const dBras = dir(elev, ecart);
    J["coude"+c] = av(J["epaule"+c], dBras, OS.bras);
    /* L'avant-bras plie dans le plan du bras */
    const dAv = dir(elev - fl, ecart + o["rot"+c]*s*0.4);
    J["poignet"+c] = av(J["coude"+c], dAv, OS.avbras);
  });

  /* Jambes. 0° = tendue vers le bas, 90° = cuisse à l'horizontale devant. */
  [["G",-1],["D",1]].forEach(([c, s])=>{
    const fl = o["hanche"+c], ouv = o["ouv"+c]*s, gen = o["genou"+c];
    const dCuisse = dir(fl, ouv);
    J["genou"+c] = av(J["hanche"+c], dCuisse, OS.cuisse);
    const dTibia = dir(fl - gen, ouv);
    J["cheville"+c] = av(J["genou"+c], dTibia, OS.tibia);
    const dPied = dir(fl - gen + 90 + o["cheville"+c], ouv);
    J["pied"+c] = av(J["cheville"+c], dPied, OS.pied);
  });

  /* Ancrage : évite d'avoir à recalculer la hauteur du bassin à chaque pose */
  if(o.ancrage !== "libre"){
    const bas = o.ancrage === "mains"
      ? Math.min(J.poignetG[1], J.poignetD[1], J.piedG[1], J.piedD[1])
      : Math.min(J.chevilleG[1], J.chevilleD[1], J.piedG[1], J.piedD[1]);
    const dec = SOL - bas;
    Object.keys(J).forEach(k => { J[k] = [J[k][0], J[k][1] + dec, J[k][2]]; });
  }

  /* Bascule globale du corps autour de l'axe X, autour du bassin */
  if(o.inclinaison){
    const a = o.inclinaison*RAD, ca = Math.cos(a), sa = Math.sin(a);
    Object.keys(J).forEach(k=>{
      const dy = J[k][1]-o.y, dz = J[k][2]-o.z;
      J[k] = [J[k][0], o.y + dy*ca - dz*sa, o.z + dy*sa + dz*ca];
    });
  }
  return J;
}

/* ------------------------------------------------------------
   Projection : rotation de la scène puis vue orthographique.
   La profondeur retournée sert à dessiner du fond vers l'avant.
   ------------------------------------------------------------ */
function projeter(p, lacet, tangage){
  const cl = Math.cos(lacet*RAD), sl = Math.sin(lacet*RAD);
  const x =  p[0]*cl + p[2]*sl;
  const z = -p[0]*sl + p[2]*cl;
  const ct = Math.cos(tangage*RAD), st = Math.sin(tangage*RAD);
  return [x, p[1]*ct - z*st, p[1]*st + z*ct];
}

/* Ossature : liste des segments à tracer, avec leur épaisseur et leur rôle */
const SEGMENTS = [
  ["bassin","cou",      4.4,"torse"],
  ["cou","tete",        3.0,"cou"],
  ["epauleG","epauleD", 3.2,"torse"],
  ["hancheG","hancheD", 3.2,"torse"],
  ["epauleG","coudeG",  3.2,"membre"], ["coudeG","poignetG", 2.8,"membre"],
  ["epauleD","coudeD",  3.2,"membre"], ["coudeD","poignetD", 2.8,"membre"],
  ["hancheG","genouG",  3.8,"membre"], ["genouG","chevilleG",3.2,"membre"],
  ["hancheD","genouD",  3.8,"membre"], ["genouD","chevilleD",3.2,"membre"],
  ["chevilleG","piedG", 2.4,"membre"], ["chevilleD","piedD", 2.4,"membre"]
];

/* ------------------------------------------------------------
   Rendu d'une pose en SVG.
   Les segments les plus éloignés sont tracés en premier et
   assombris : c'est ce qui donne la lecture du volume.
   ------------------------------------------------------------ */
function rendre3D(J, lacet, tangage, ech, cx, cy, props){
  const P = {};
  Object.keys(J).forEach(k => { P[k] = projeter(J[k], lacet, tangage); });

  const toutZ = Object.values(P).map(p=>p[2]);
  const zMin = Math.min(...toutZ), zMax = Math.max(...toutZ) || 1;
  const etendue = Math.max(12, zMax - zMin);
  const ecr = p => [cx + p[0]*ech, cy - p[1]*ech];

  const pieces = [];

  (props||[]).forEach(f=>{
    const c = [f.x, f.y, f.z];
    const coins = [];
    for(const sx of [-.5,.5]) for(const sy of [-.5,.5]) for(const sz of [-.5,.5])
      coins.push(projeter([c[0]+(f.l||0)*sx, c[1]+(f.h||0)*sy, c[2]+(f.p||0)*sz], lacet, tangage));
    const z = coins.reduce((a,p)=>a+p[2],0)/8;
    /* Enveloppe convexe des huit sommets : le volume garde sa forme en tournant */
    const pts = coins.map(ecr).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const cr = (o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
    const moitie = src => { const h=[]; for(const pt of src){
      while(h.length>=2 && cr(h[h.length-2],h[h.length-1],pt)<=0) h.pop(); h.push(pt); } h.pop(); return h; };
    const env = moitie(pts).concat(moitie(pts.slice().reverse()));
    pieces.push({ z:z - 0.1,
      svg:`<polygon points="${env.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" class="f3-prop"/>` });
  });

  SEGMENTS.forEach(([a, b, ep, role])=>{
    if(!P[a] || !P[b]) return;
    const A = ecr(P[a]), B = ecr(P[b]);
    const z = (P[a][2] + P[b][2]) / 2;
    const t = (z - zMin) / etendue;                 // 0 = au fond, 1 = devant
    const largeur = (ep * (0.74 + t*0.5) * ech / 2.6).toFixed(2);
    const opac = (0.42 + t*0.58).toFixed(2);
    const cls = role === "torse" ? "f3-torse" : role === "cou" ? "f3-cou" : "f3-membre";
    pieces.push({ z, svg:`<line x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" x2="${B[0].toFixed(1)}" y2="${B[1].toFixed(1)}" class="${cls}" stroke-width="${largeur}" stroke-opacity="${opac}"/>` });
  });

  ["poignetG","poignetD","piedG","piedD"].forEach(k=>{
    if(!P[k]) return;
    const A = ecr(P[k]), t = (P[k][2] - zMin) / etendue;
    pieces.push({ z:P[k][2] + 0.005,
      svg:`<circle cx="${A[0].toFixed(1)}" cy="${A[1].toFixed(1)}" r="${(2.1*ech*(0.8+t*0.3)).toFixed(1)}" class="f3-bout" fill-opacity="${(0.5+t*0.5).toFixed(2)}"/>` });
  });

  if(P.tete){
    const T = ecr(P.tete);
    const t = (P.tete[2] - zMin) / etendue;
    pieces.push({ z:P.tete[2] + 0.01,
      svg:`<circle cx="${T[0].toFixed(1)}" cy="${T[1].toFixed(1)}" r="${(OS.tete*ech*(0.86+t*0.22)).toFixed(1)}" class="f3-tete" stroke-opacity="${(0.5+t*0.5).toFixed(2)}"/>` });
  }

  pieces.sort((a,b)=>a.z-b.z);
  return pieces.map(p=>p.svg).join("");
}

/* ------------------------------------------------------------
   Affichage d'un exercice : interpolation entre les deux poses,
   rotation au doigt, boucle d'animation.
   ------------------------------------------------------------ */
const VUE3D = {};          // id de figure → {lacet, tangage}
let RAF3D = null;

function cadre3D(cle, opts){
  const f = FIG3D[cle];
  if(!f) return "";
  const o = opts || {};
  const uid = "v" + Math.random().toString(36).slice(2, 8);
  const v = VUE3D[cle] || (VUE3D[cle] = {lacet: f.vue !== undefined ? f.vue : 28, tangage: -8});
  const H = o.h || 210, W = o.w || 300;
  const ech = o.ech || 1.55, cx = W/2, cy = H*0.60;
  const J = squelette(f.a);
  const corps = rendre3D(J, v.lacet, v.tangage, ech, cx, cy, f.props);
  const sol = projeter([0, SOL, 0], v.lacet, v.tangage);
  return `<div class="f3-boite${o.mini?" mini":""}" data-f3="${cle}" id="${uid}">
    <svg viewBox="0 0 ${W} ${H}" class="f3" preserveAspectRatio="xMidYMid meet">
      <g class="f3-sol"><ellipse cx="${cx}" cy="${(cy - sol[1]*ech).toFixed(1)}" rx="${(42*ech).toFixed(1)}" ry="${(7*ech).toFixed(1)}"/></g>
      <g class="f3-corps">${corps}</g>
    </svg>
    ${o.mini ? "" : `<div class="f3-outils">
      <button class="f3-btn" onclick="tourner3D('${cle}',-30)" aria-label="Tourner à gauche">↺</button>
      <span class="f3-aide">Fais glisser pour tourner</span>
      <button class="f3-btn" onclick="tourner3D('${cle}',30)" aria-label="Tourner à droite">↻</button>
    </div>`}
  </div>`;
}

function tourner3D(cle, d){
  const v = VUE3D[cle]; if(!v) return;
  v.lacet = (v.lacet + d) % 360;
  v.fige = true; setTimeout(()=>{ v.fige = false; }, 1400);
}

/* Animation : phase de descente, tenue, remontée, pause */
function phase3D(u){
  if(u < .40) return doux3D(u/.40);
  if(u < .54) return 1;
  if(u < .90) return 1 - doux3D((u-.54)/.36);
  return 0;
}
const doux3D = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

function melanger(a, b, t){
  const out = {};
  const cles = new Set([...Object.keys(a), ...Object.keys(b)]);
  cles.forEach(k=>{
    const va = a[k] ?? 0, vb = b[k] ?? 0;
    out[k] = va + (vb - va) * t;
  });
  return out;
}

function animer3D(){
  if(RAF3D) cancelAnimationFrame(RAF3D);
  const boites = Array.from(document.querySelectorAll("[data-f3]"));
  if(!boites.length) return;
  const t0 = performance.now();
  const boucle = (now)=>{
    boites.forEach(el=>{
      const cle = el.dataset.f3, f = FIG3D[cle];
      if(!f) return;
      const svg = el.querySelector(".f3-corps"); if(!svg) return;
      const v = VUE3D[cle] || (VUE3D[cle] = {lacet:28, tangage:-8});
      const duree = f.duree || 3600;
      const t = f.b ? phase3D(((now - t0) % duree) / duree) : 0;
      const pose = f.b ? melanger(f.a, f.b, t) : f.a;
      const vb = el.querySelector("svg").viewBox.baseVal;
      const ech = el.classList.contains("mini") ? 1.05 : 1.55;
      svg.innerHTML = rendre3D(squelette(pose), v.lacet, v.tangage,
                               ech, vb.width/2, vb.height*0.60, f.props);
      const e = el.querySelector(".f3-sol ellipse");
      if(e){ const s0 = projeter([0, SOL, 0], v.lacet, v.tangage);
             e.setAttribute("cy", (vb.height*0.60 - s0[1]*ech).toFixed(1)); }
    });
    RAF3D = requestAnimationFrame(boucle);
  };
  RAF3D = requestAnimationFrame(boucle);
}

/* Rotation au doigt ou à la souris */
function brancherRotation(){
  let actif = null, x0 = 0, y0 = 0, l0 = 0, t0 = 0;
  const debut = (e, el)=>{
    const cle = el.dataset.f3; if(!cle) return;
    actif = cle; const p = e.touches ? e.touches[0] : e;
    x0 = p.clientX; y0 = p.clientY;
    const v = VUE3D[cle] || (VUE3D[cle] = {lacet:28, tangage:-8});
    l0 = v.lacet; t0 = v.tangage;
  };
  const bouge = (e)=>{
    if(!actif) return;
    const p = e.touches ? e.touches[0] : e;
    const v = VUE3D[actif];
    v.lacet = l0 - (p.clientX - x0) * 0.6;
    v.tangage = Math.max(-60, Math.min(60, t0 + (p.clientY - y0) * 0.4));
    if(e.cancelable) e.preventDefault();
  };
  const fin = ()=>{ actif = null; };
  document.addEventListener("pointerdown", e=>{
    const el = e.target.closest && e.target.closest("[data-f3]");
    if(el && !el.classList.contains("mini")) debut(e, el);
  });
  document.addEventListener("pointermove", bouge, {passive:false});
  document.addEventListener("pointerup", fin);
  document.addEventListener("pointercancel", fin);
}

function machinesParDefaut(){
  return Object.keys(MACHINES).filter(k => MACHINES[k].def);
}
function machinesZone(z){
  return Object.keys(MACHINES).filter(k => MACHINES[k].z === z);
}
/* ============================================================
   POSES 3D — vocabulaire commun
   S() symétrise : hanche:90 devient hancheG:90 et hancheD:90.
   ============================================================ */
function S(p){
  const paires = ["hanche","genou","epaule","coude","ecart","ouv","cheville","rot"];
  const o = {};
  Object.keys(p).forEach(k=>{
    if(paires.indexOf(k) > -1){ o[k+"G"] = p[k]; o[k+"D"] = p[k]; }
    else o[k] = p[k];
  });
  return o;
}

          catch(e){ this.ok=false; } return this.ok; },

/* ============================================================
   DATES
   ============================================================ */
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }
function aujourdhui(){ return iso(new Date()); }
function dPlus(dateStr,n){
  const d = new Date((dateStr || aujourdhui()) + "T12:00:00");
  if(isNaN(d.getTime())) return aujourdhui();       // date absente ou corrompue
  d.setDate(d.getDate()+n); return iso(d);
}
function joursEntre(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); }
function jourSemaine(dateStr){ return new Date(dateStr+"T12:00:00").getDay(); }
const JOURS_FR = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MOIS_FR  = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function dateCourte(dateStr){ const d=new Date(dateStr+"T12:00:00"); return d.getDate()+" "+MOIS_FR[d.getMonth()]; }

function numSemaine(dateStr){
  const n = joursEntre(E.profil.dateDebut, dateStr||aujourdhui());
  return Math.max(1, Math.floor(n/7) + 1 - (E.reglages.decalageSem||0));
}
function estDeload(sem){ return DELOADS.includes(sem); }

/* ============================================================
   CALCULS ÉNERGÉTIQUES
   ============================================================ */
function poidsActuel(){
  const m = moyenneMobile(aujourdhui(), 7);
  return m !== null ? m : E.profil.poidsDepart;
}
function objectif(){ return OBJECTIFS[E.profil.objectif] || OBJECTIFS.maintien; }
function agressivite(){ return E.profil.agressivite || "moderee"; }

function masseMaigre(){
  const bf = E.profil.masseGrasse;
  return (typeof bf === "number" && bf > 3 && bf < 60) ? poidsActuel() * (1 - bf/100) : null;
}
function metabolismeBase(){
  const lbm = masseMaigre();
  if(lbm) return Math.round(370 + 21.6 * lbm);                       // Katch-McArdle
  const p = poidsActuel(), t = E.profil.taille, a = E.profil.age;    // Mifflin-St Jeor
  return Math.round(10*p + 6.25*t - 5*a + (E.profil.sexe === "h" ? 5 : -161));
}
function maintien(){
  let m = metabolismeBase() * (E.profil.activite || 1.35);
  if(E.profil.metabolismeVif) m *= 1.10;
  return Math.round(m);
}
function kcalActivite(dateStr){
  const d = dateStr || aujourdhui();
  const h = E.activites[d] ?? E.livraison[d] ?? 0;
  const t = ACTIVITES_HORAIRES[E.profil.activiteType] || ACTIVITES_HORAIRES.aucune;
  return Math.round(h * t.met * 1.05 * poidsActuel());
}
function surplusCible(){
  const o = objectif();
  return Math.round(maintien() * (o.surplus[agressivite()] ?? 0));
}
/* Plancher de sécurité : jamais sous le métabolisme de base,
   ni sous un minimum absolu — un déficit trop profond coûte du muscle. */
function plancherKcal(){
  return Math.max(E.profil.sexe === "h" ? 1500 : 1200, Math.round(metabolismeBase() * 0.90));
}
function cibleKcal(dateStr){
  const brut = maintien() + surplusCible() + (E.reglages.ajustement||0) + kcalActivite(dateStr);
  return Math.max(plancherKcal(), Math.round(brut));
}
function cibleBridee(){ return maintien() + surplusCible() + (E.reglages.ajustement||0) < plancherKcal(); }

function cibleMacros(dateStr){
  const kcal = cibleKcal(dateStr), o = objectif();
  const lbm = masseMaigre(), base = lbm || poidsActuel();
  let prot = Math.round(base * (E.reglages.ratioProt || (lbm ? o.protLBM : o.prot)));
  let lip  = Math.round(base * (E.reglages.ratioLip  || o.lip));
  const lipMin = Math.round(poidsActuel() * o.lipMin);
  let gluc = Math.round((kcal - prot*4 - lip*9) / 4);
  if(gluc < 30){ lip = Math.max(lipMin, Math.round((kcal - prot*4 - 120) / 9)); gluc = Math.round((kcal - prot*4 - lip*9)/4); }
  if(gluc < 0){ prot = Math.max(Math.round(base*1.4), Math.round((kcal - lipMin*9)/4 - 10)); lip = lipMin; gluc = Math.round((kcal - prot*4 - lip*9)/4); }
  return {kcal, prot:Math.max(0,prot), lip:Math.max(0,lip), gluc:Math.max(0,gluc)};
}
/* Rythme visé en grammes par semaine, signé selon l'objectif */
function rythmeCible(){
  const o = objectif(), r = o.rythme[agressivite()] || o.rythme.moderee, p = poidsActuel();
  return {min: Math.round(r[0]*p*1000), max: Math.round(r[1]*p*1000), signe:o.signe};
}
function gainCible(){ const r = rythmeCible(); return {min:r.min, max:r.max}; }

/* ============================================================
   RÉGIME ALIMENTAIRE — filtrage automatique

function exclusionsProfil(){
  const base = ((REGIMES[E.profil.regime] || REGIMES.omni).excl || []).slice();
  (E.profil.intolerances || []).forEach(t => { if(base.indexOf(t) < 0) base.push(t); });

}
function alimentCompatible(id){
  if((E.profil.exclusions || []).indexOf(id) > -1) return false;
  const ex = exclusionsProfil();
  return !(TAGS_ALIMENTS[id] || []).some(t => ex.indexOf(t) > -1);
}

}
function recetteCompatible(r){ return (r.ing||[]).every(pair => alimentCompatible(pair[0])); }
function bloquantsRecette(r){
  const ex = exclusionsProfil(), out = [];
  (r.ing||[]).forEach(pair => {
    const id = pair[0];

   PORTIONS — chaque recette s'ajuste à la cible de la personne

const PART_REPAS = {matin:0.26, midi:0.32, soir:0.30, shake:0.18, collation:0.12};
function portionSuggeree(r){
  const base = macrosRecette(r, 1).kcal;
  if(!base) return 1;
  const cible = cibleKcal() * (PART_REPAS[r.m] || 0.26);
  return Math.max(0.25, Math.min(3, Math.round(cible/base * 4) / 4));
}
function normaliserRepas(v){ return typeof v === "string" ? {i:v, q:1} : {i:v.i, q:v.q || 1}; }
/* ============================================================
   POIDS — moyenne mobile 7 jours
   ============================================================ */
function moyenneMobile(dateStr, fenetre){
  const vals=[];
  for(let i=0;i<fenetre;i++){
    const v = E.poids[dPlus(dateStr,-i)];
    if(typeof v === "number") vals.push(v);
  }
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
}
function serieMoyenneMobile(nbJours){
  const out=[], fin=aujourdhui();
  for(let i=nbJours-1;i>=0;i--){
    const d = dPlus(fin,-i);
    out.push({d, v:moyenneMobile(d,7), brut:E.poids[d] ?? null});
  }
  return out;
}
function nbPesees(){ return Object.keys(E.poids).length; }

/* ============================================================
   RECETTES — macros et coût calculés depuis la base aliments
   ============================================================ */
function toutesRecettes(){ return RECETTES.concat(E.recettesPerso||[]); }
function trouverRecette(id){ return toutesRecettes().find(r=>r.id===id) || null; }

function macrosRecette(r, q){
  const m = q || 1;
  let k=0,p=0,g=0,l=0,cout=0;
  (r.ing||[]).forEach(([id,gr])=>{
    const a = AL(id); if(!a) return;
    const x = gr*m;
    k += a.k*x/100; p += a.p*x/100; g += a.g*x/100; l += a.l*x/100;
    cout += a.prix*x/1000;
  });
  return {kcal:Math.round(k), prot:Math.round(p), gluc:Math.round(g), lip:Math.round(l), cout:Math.round(cout*100)/100};
}
function kcalJour(dateStr){ return macrosJour(dateStr).kcal; }
function macrosJour(dateStr){
  const t={kcal:0,prot:0,gluc:0,lip:0,cout:0};
  (E.repas[dateStr]||[]).forEach(v=>{
    const e = normaliserRepas(v), r = trouverRecette(e.i); if(!r) return;
    const m = macrosRecette(r, e.q);
    t.kcal+=m.kcal; t.prot+=m.prot; t.gluc+=m.gluc; t.lip+=m.lip; t.cout+=m.cout;
  });
  t.cout = Math.round(t.cout*100)/100;
  return t;
}

/* ============================================================
   PROGRAMME — généré à partir du profil
   objectif + niveau + fréquence + matériel → 52 semaines
   ============================================================ */
let PROG_CACHE = null;
function cleProfil(){
  const p = E.profil;
  return [p.objectif,p.niveau,p.frequence,(p.machines||[]).slice().sort().join(","),
          Object.keys(E.exosPerso||{}).length].join("|");
}
function materielDispo(){ return ["mobilier"].concat(E.profil.materiel || []); }
function exoDispo(id){
  const x = EX(id); if(!x) return false;
  const dispo = materielDispo();
  return (x.eq || []).every(e => dispo.indexOf(e) > -1);
}
/* Un exercice « chargeable » accepte une charge réglable au kilo près :
   indispensable en objectif force, où l'on travaille en séries courtes. */
function chargeable(id){
  const x = EX(id); if(!x) return false;
  return (x.eq||[]).some(e => ["halteres","barre","salle","sac"].indexOf(e) > -1);
}
function poolPatron(pat, nivMax){
  const T = tousExos();
  let l = Object.keys(T)
    .filter(id => T[id].pat === pat && exoDispo(id) && (T[id].niv || 2) <= nivMax);
  /* En objectif force on travaille en séries de 2 à 5 répétitions :
     seuls les exercices dont la charge se règle au kilo près conviennent.
     On restreint le vivier plutôt que de simplement le trier, sinon la
     rotation d'exercices ramène des mouvements au poids du corps. */
  if(E.profil.objectif === "force" && pat !== "gainage" && pat !== "cardio"){
    const ch = l.filter(chargeable);
    if(ch.length) l = ch;
  }
  return l.sort((a,b) => (T[a].niv||2) - (T[b].niv||2) || a.localeCompare(b));
}
const NIVEAUX = {debutant:1, intermediaire:2, avance:3};
const NIVEAUX_N = {debutant:"Débutant", intermediaire:"Intermédiaire", avance:"Avancé"};

function genererProgramme(){
  const p = E.profil;
  const split = SPLITS[p.frequence] || SPLITS[3];
  const nivMax = NIVEAUX[p.niveau] || 1;
  const dos = (DOSAGE[p.objectif] || DOSAGE.maintien)[p.niveau] || DOSAGE.maintien.debutant;
  const o = objectif();
  const card = CARDIO[p.objectif] || CARDIO.maintien;

  /* Une variante de séance par rotation, pour changer d'exercices tous les 16 semaines */
  function seancesPour(rot){
    return split.trames.map((tk, si) => {
      const tr = TRAMES[tk], pris = [];
      /* En force, les repos dépassent trois minutes : au-delà de cinq
         exercices la séance devient interminable et la qualité chute. */
      const motifs = p.objectif === "force" ? tr.pat.slice(0, 5) : tr.pat;
      const REPLI = {tirV:"tirH", pouV:"pouH", mollet:"genou", bras:"pouH", cardio:"genou"};
      const ex = motifs.map((pat0, i) => {
        let pat = pat0;
        let pool = poolPatron(pat, nivMax).filter(id => pris.indexOf(id) < 0);
        if(!pool.length) pool = poolPatron(pat, 3).filter(id => pris.indexOf(id) < 0);
        if(!pool.length && REPLI[pat]){ pat = REPLI[pat];
          pool = poolPatron(pat, 3).filter(id => pris.indexOf(id) < 0); }
        if(!pool.length) return null;
        const id = pool[(si*2 + i + rot*3) % pool.length];
        pris.push(id);
        const x = EX(id);
        let s = i < 2 ? dos.s[1] : dos.s[0];
        let rmin = dos.r[0], rmax = dos.r[1];
        if(pat === "bras")    { rmin = Math.max(8, rmin);  rmax = Math.max(15, rmax); }
        if(pat === "mollet")  { rmin = Math.max(10, rmin); rmax = Math.max(20, rmax); }
        if(pat === "gainage" || x.tempo === "iso"){ rmin = 20; rmax = 45; }
        if(x.duree)           { rmin = 20; rmax = 40; }
        return [id, s, rmin, rmax];
      }).filter(Boolean);
      return {id:"s"+si+"r"+rot, n:tr.n, ex};
    });
  }

  /* Séances de cardio si l'objectif en demande */
  const minCardio = card.min;
  const nCardio = minCardio >= 150 ? 3 : minCardio >= 90 ? 2 : minCardio >= 60 ? 1 : 0;
  const poolCardio = poolPatron("cardio", nivMax).length ? poolPatron("cardio", nivMax) : poolPatron("cardio", 3);
  const seancesCardio = [];
  for(let i = 0; i < nCardio; i++){
    const id = poolCardio[i % poolCardio.length];
    if(!id) break;
    const duree = Math.round(minCardio / Math.max(1, nCardio));
    seancesCardio.push({id:"c"+i, n:"Cardio", cardio:true, ex:[[id, 1, duree, duree]]});
  }

  /* Attribution des jours de la semaine */
  const libres = [1,2,3,4,5,6,0].filter(j => split.jours.indexOf(j) < 0);
  const jours = {};
  split.jours.forEach((j, i) => { jours[j] = {type:"muscu", i}; });
  seancesCardio.forEach((c, i) => { if(libres[i] !== undefined) jours[libres[i]] = {type:"cardio", i}; });

  /* Six blocs sur l'année : volume croissant, deload toutes les 8 semaines */
  /* Plafond de séries : on ne pousse le volume que si l'objectif le justifie.
     En forme et santé ou en maintien, empiler les séries n'apporte rien. */
  /* Plus la fréquence est élevée, moins il faut ajouter de séries par séance :
     c'est le volume hebdomadaire total qui compte, pas celui d'une séance. */
  const capSeries = p.objectif === "force" ? dos.s[1]
                  : (p.objectif === "sante" || p.objectif === "maintien") ? dos.s[1] + 1
                  : p.frequence >= 5 ? dos.s[1]
                  : p.frequence === 4 ? dos.s[1] + 1
                  : dos.s[1] + 2;
  const noms = ["Prise en main","Fondations","Accumulation","Intensification","Développement","Consolidation"];
  const bornes = [[1,8],[9,16],[17,24],[25,32],[33,40],[41,52]];
  const blocs = bornes.map((b, i) => {
    const rot = Math.floor(i/2);
    /* En force on progresse par la charge, jamais en empilant les séries. */
    const bonus = p.objectif === "force" ? 0 : Math.min(2, Math.floor(i/1.6));
    const seances = seancesPour(rot).map(se => ({
      id:se.id + "b" + (i+1), n:se.n,
      /* Bloc 1 : volume allégé, mais jamais en dessous de 2 séries —
         une série unique ne produit pas d'adaptation mesurable. */
      ex: se.ex.map(e => {
        const dec = i === 0 ? (e[1] >= 3 ? -1 : 0) : bonus;
        return [e[0], Math.max(2, Math.min(capSeries, e[1] + dec)), e[2], e[3]];
      })
    }));
    const rirBloc = i === 0 ? [dos.rir[1], dos.rir[1]+1] : dos.rir;
    return {
      id:i+1, n:noms[i], s:b, freq:p.frequence, format:split.n,
      joursTxt: split.jours.map(j => JOURS_FR[j]).join(" · "),
      rir: rirBloc[0] === rirBloc[1] ? String(rirBloc[0]) : rirBloc[0]+"-"+rirBloc[1],
      rirMin: rirBloc[0], rirMax: rirBloc[1],
      vol: (i===0 ? "volume réduit" : bonus ? "volume élevé" : "volume standard"),
      mat: machinesActives().length + " machines sélectionnées",
      obj: i === 0
        ? "Apprendre les mouvements et installer la routine. Tu vas trouver ça trop facile : c'est voulu, des courbatures de cinq jours te feraient rater les séances suivantes."
        : i === 5
        ? "Dernier bloc de l'année. On consolide, on fait le bilan complet en semaine 49, puis on décide de la suite."
        : "Le volume monte d'un cran. Les exercices changent tous les seize semaines pour éviter la stagnation." ,
      regle: o.focus,
      seances, seancesCardio, jours, repos: dos.repos
    };
  });
  return {blocs, split, dos, nCardio, minCardio, seancesCardio, jours};
}
function programme(){
  const cle = cleProfil();
  if(!PROG_CACHE || PROG_CACHE.cle !== cle) PROG_CACHE = {cle, v:genererProgramme()};
  return PROG_CACHE.v;
}
const BLOCS = new Proxy({}, {
  get(_, k){ const b = programme().blocs; return k === "length" ? b.length : (typeof k === "string" && /^\d+$/.test(k) ? b[+k] : b[k] !== undefined ? b[k] : b[Symbol.iterator] && Array.prototype[k] && Array.prototype[k].bind(b)); }
});
function tousBlocs(){ return programme().blocs; }
function blocPourSemaine(sem){
  const b = tousBlocs();
  return b.find(x => sem >= x.s[0] && sem <= x.s[1]) || b[b.length-1];
}
function seancePrevue(dateStr){
  const d = dateStr || aujourdhui();
  const sem = numSemaine(d), bloc = blocPourSemaine(sem), jour = jourSemaine(d);
  const j = bloc.jours[jour];
  if(!j) return null;
  const se = j.type === "cardio" ? bloc.seancesCardio[j.i] : bloc.seances[j.i];
  if(!se) return null;
  return {bloc, seance:se, deload:estDeload(sem), sem, cardio:!!se.cardio};
}
function seanceFaite(dateStr){ const s = E.seances[dateStr]; return !!(s && s.fini); }
function seriesEffectives(exDef, deload){
  return deload ? Math.max(1, Math.ceil(exDef[1]/2)) : exDef[1];
}
function reposExo(exoId, bloc){
  const x = EX(exoId); if(!x) return 120;
  /* Plafonné à cinq minutes : au-delà, la phosphocréatine est déjà
     entièrement resynthétisée et la séance s'étire pour rien. */
  return Math.min(300, Math.round((x.repos || 120) * ((bloc && bloc.repos) || 1)));
}
function meilleurePerf(exoId){
  let best = null;
  Object.entries(E.seances).forEach(([d,s])=>{
    const series = (s.ex||{})[exoId]; if(!series || !series.length) return;
    series.forEach(se=>{
      const score = (se.l||0)*3 + (se.r||0);
      if(!best || score > best.score) best = {score, r:se.r, l:se.l||0, d};
    });
  });
  return best;
}
function derniereSeanceExo(exoId){
  const dates = Object.keys(E.seances).filter(d => (E.seances[d].ex||{})[exoId]).sort();
  if(!dates.length) return null;
  const d = dates[dates.length-1];
  return {date:d, series:E.seances[d].ex[exoId]};
}
/* Tendance de force : compare les 14 derniers jours aux 14 précédents */
function tendanceForce(){
  const fin = aujourdhui();
  let recent = 0, ancien = 0, nR = 0, nA = 0;
  Object.entries(E.seances).forEach(([d,s])=>{
    const dj = joursEntre(d, fin);
    Object.values(s.ex || {}).forEach(series => (series||[]).forEach(se=>{
      if(!se || !se.r) return;
      const v = se.r + (se.l||0)*3;
      if(dj <= 14){ recent += v; nR++; } else if(dj <= 28){ ancien += v; nA++; }
    }));
  });
  if(nR < 6 || nA < 6) return null;
  return (recent/nR) / (ancien/nA) - 1;
}
/* ============================================================
   ADHÉRENCE
   ============================================================ */
function adherence(nbJours){
  const fin = aujourdhui();
  let seancesPrevues=0, seancesFaites=0, joursRepas=0, joursOk=0, bio=[], som=[], heuresLivr=0, prot=0, nProt=0;
  for(let i=0;i<nbJours;i++){
    const d = dPlus(fin,-i);
    if(joursEntre(E.profil.dateDebut, d) < 0) continue;
    if(seancePrevue(d)){ seancesPrevues++; if(seanceFaite(d)) seancesFaites++; }
    if((E.repas[d]||[]).length){
      joursRepas++;
      const k = kcalJour(d), c = cibleKcal(d);
      if(k >= c*0.9 && k <= c*1.12) joursOk++;
    }
    const j = E.journal[d];
    if(j) bio.push((j.sommeil+j.energie+j.appetit+j.motiv)/4);
    if(j && typeof j.sommeil === "number") som.push(j.sommeil);
    heuresLivr += (E.activites[d] ?? E.livraison[d] ?? 0);
    prot += macrosJour(d).prot; nProt += (E.repas[d]||[]).length ? 1 : 0;
  }
  return {
    seancesPrevues, seancesFaites,
    tauxSeances: seancesPrevues ? seancesFaites/seancesPrevues : null,
    joursRepas, joursOk,
    tauxRepas: joursRepas ? joursOk/joursRepas : null,
    bioMoyen: bio.length ? bio.reduce((a,b)=>a+b,0)/bio.length : null,
    bioN: bio.length,
    sommeilMoyen: som.length ? som.reduce((a,b)=>a+b,0)/som.length : null,
    protMoyen: nProt ? Math.round(prot/nProt) : null,
    heuresLivr: Math.round(heuresLivr*10)/10
  };
}

/* ============================================================
   MOTEUR D'ANALYSE — la lecture change selon l'objectif.
   type : "alerte" | "action" | "ok" | "info"
   ============================================================ */
function analyser(){
  const out = [], fin = aujourdhui(), sem = numSemaine(fin);
  const o = objectif(), cible = rythmeCible(), a14 = adherence(14);
  const maNow = moyenneMobile(fin, 7), maAvant = moyenneMobile(dPlus(fin,-14), 7);
  const p = poidsActuel(), mac = cibleMacros();
  const nomObj = o.n.toLowerCase();

  /* --- Cible bridée par le plancher de sécurité --- */
  if(cibleBridee()){
    out.push({type:"alerte", t:"Cible remontée au plancher de sécurité",
      x:"Le déficit demandé descendait sous "+plancherKcal()+" kcal, c'est-à-dire sous ton métabolisme de base. À ce niveau, la perte se fait largement au détriment du muscle, l'appétit devient ingérable et le plan ne tient pas. L'application a relevé ta cible d'office. Si tu veux perdre plus vite, ajoute de la marche plutôt que de retirer des calories."});
  }

  /* --- Données insuffisantes --- */
  if(nbPesees() < 6 || maNow === null){
    out.push({type:"info", t:"Pas encore assez de données",
      x:"Il me faut au moins six pesées réparties sur deux semaines avant de juger quoi que ce soit. Pèse-toi le matin à jeun, après les toilettes, avant de boire. Un chiffre isolé ne veut rien dire : c'est la moyenne sur sept jours qui compte."});
    return out;
  }

  /* --- Deload --- */
  if(estDeload(sem)){
    out.push({type:"info", t:"Semaine "+sem+" : deload",
      x:"Fais la moitié des séries prévues et arrête-toi à RIR 4. Tu vas te sentir frais et avoir l'impression de perdre ton temps : c'est exactement l'effet recherché. La fatigue accumulée se vide pendant que les adaptations se consolident. Les calories, elles, ne changent pas."});
  }

  /* --- Surcharge --- */
  if(a14.bioMoyen !== null && a14.bioN >= 5 && a14.bioMoyen < 2.4){
    out.push({type:"alerte", t:"Signal de surcharge",
      x:"Ton ressenti moyen est à "+a14.bioMoyen.toFixed(1)+" sur 5 depuis quatorze jours. C'est le profil d'une fatigue qui s'accumule. Réduis le volume de trente pour cent cette semaine et monte le RIR de deux points. Si le sommeil est en cause, supprime une séance plutôt que de rogner sur les nuits."});
  }
  if(a14.sommeilMoyen !== null && a14.sommeilMoyen < 2.5 && a14.bioN >= 5){
    out.push({type:"action", t:"Sommeil insuffisant",
      x:"Ta note de sommeil moyenne est de "+a14.sommeilMoyen.toFixed(1)+" sur 5. C'est la variable qui casse en premier et qui entraîne tout le reste : la force chute, l'appétit se dérègle, la récupération s'effondre. Aucun réglage alimentaire ne compense un manque de sommeil chronique. Traite ça avant tout le reste."});
  }

  /* --- Exécution avant réglage --- */
  let executionFaible = false;
  if(a14.tauxRepas !== null && a14.joursRepas >= 7 && a14.tauxRepas < 0.7){
    executionFaible = true;
    /* sous la cible ou au-dessus ? le correctif n'est pas le même */
    let sous = 0, sur = 0;
    for(let i=0;i<14;i++){ const dd = dPlus(fin,-i);
      if(!(E.repas[dd]||[]).length) continue;
      const k = kcalJour(dd), cc = cibleKcal(dd);
      if(k < cc*0.9) sous++; else if(k > cc*1.12) sur++; }
    out.push({type:"action", t: sur > sous ? "Tu dépasses régulièrement ta cible" : "L'exécution avant le réglage",
      x: sur > sous
        ? "Sur les "+a14.joursRepas+" derniers jours suivis, "+sur+" dépassent ta cible de plus de douze pour cent. Avant de toucher au moindre réglage, il faut resserrer les portions : c'est le seul correctif utile ici. Le bouton Portion dans chaque recette te permet d'ajuster au quart près."
        : "Tu as tenu ta cible sur "+a14.joursOk+" des "+a14.joursRepas+" derniers jours suivis, soit "+Math.round(a14.tauxRepas*100)+" %, dont "+sous+" journées sous la cible. Changer le chiffre maintenant ne servirait à rien : le problème est l'écart entre la cible et l'assiette. Objectif de la quinzaine : atteindre 85 %."});
  }
  if(a14.tauxSeances !== null && a14.seancesPrevues >= 4 && a14.tauxSeances < 0.6){
    out.push({type:"action", t:"Séances trop irrégulières",
      x:"Tu as fait "+a14.seancesFaites+" séances sur "+a14.seancesPrevues+" prévues. En dessous de soixante pour cent, aucun programme ne fonctionne. Baisse l'ambition plutôt que d'abandonner : passe à une fréquence inférieure dans les réglages, mais tiens-la. Deux séances réellement faites battent quatre séances théoriques."});
  }

  /* --- Protéines --- */
  if(a14.protMoyen !== null && a14.joursRepas >= 5){
    const ratio = a14.protMoyen / mac.prot;
    if(ratio < 0.75){
      out.push({type:"action", t:"Protéines trop basses — "+a14.protMoyen+" g/jour",
        x:"Ta cible est de "+mac.prot+" g. "+(o.signe < 0
          ? "Pendant une perte de gras, les protéines sont ce qui protège ton muscle : en manquer revient à perdre du poids par le mauvais côté."
          : "Sans protéines suffisantes, le surplus calorique se transforme surtout en gras.")+" Le correctif le plus simple : une source protéinée à chaque repas, et un produit laitier ou une portion de protéines en poudre en collation."});
    }
  }

  /* --- Rythme de variation du poids --- */
  if(maAvant !== null){
    const deltaSem = Math.round((maNow - maAvant)/2*1000);
    const txt = (deltaSem>=0?"+":"")+deltaSem+" g/semaine";
    const bas = Math.min(cible.min, cible.max), haut = Math.max(cible.min, cible.max);
    const dansCible = deltaSem >= bas*0.7 && deltaSem <= haut*1.2;

    if(o.signe === 0){
      const stable = Math.abs(deltaSem) <= Math.max(200, p*2.5);
      out.push(stable
        ? {type:"ok", t:"Poids stable — "+txt,
           x:"C'est exactement ce qu'on cherche en "+nomObj+". La balance ne dira plus grand-chose à partir d'ici : juge sur tes mensurations, tes photos mensuelles et surtout tes performances à l'entraînement. Un tour de taille qui baisse pendant que les charges montent, c'est une recomposition réussie, même à poids identique."}
        : {type:"action", t:"Le poids dérive — "+txt, kcal: deltaSem > 0 ? -150 : 150,
           x:"En "+nomObj+", le poids devrait rester dans une bande de plus ou moins deux cent grammes par semaine. Ajuste de "+(deltaSem>0?"−150":"+150")+" kcal par jour et réévalue dans quatorze jours."});
    }
    else if(dansCible && !executionFaible){
      out.push({type:"ok", t:"Rythme idéal — "+txt,
        x:"Tu es dans la fenêtre visée ("+bas+" à "+haut+" g par semaine). Ne change rien : ni les calories, ni le programme. La discipline consiste ici à résister à l'envie d'accélérer. Reviens dans quatorze jours."});
    }
    else if(o.signe > 0){
      if(executionFaible && deltaSem < haut*1.2){ /* corriger l'exécution d'abord */ }
      else if(deltaSem < bas*0.7){
        out.push({type:"action", t:"Progression trop lente — "+txt, kcal:250,
          x:"Ta cible est de "+bas+" à "+haut+" g par semaine. Ajoute 250 kcal par jour : un shake, quarante grammes de purée d'oléagineux, ou deux cuillères à soupe d'huile réparties dans les plats. Vérifie aussi tes heures d'activité chiffrée sur la période : "+a14.heuresLivr+" h en quatorze jours."});
      } else {
        out.push({type:"action", t:"Progression trop rapide — "+txt, kcal:-200,
          x:"Au-delà de "+haut+" g par semaine, la part qui s'ajoute est majoritairement du gras. Retire 200 kcal par jour. Si c'est la première quinzaine au-dessus, tu peux aussi attendre quatorze jours de plus : une seule mesure peut être trompée par la rétention d'eau ou le transit."});
      }
    }
    else {
      if(executionFaible && deltaSem > bas){ /* corriger l'exécution d'abord */ }
      else if(deltaSem > haut*1.2 || deltaSem >= 0){
        out.push({type:"action", t:"Perte trop lente — "+txt, kcal:-200,
          x:"Ta cible est de "+haut+" à "+bas+" g par semaine. Deux options, dans cet ordre : ajouter deux marches de trente minutes, ou retirer 200 kcal par jour. La marche est préférable, elle ne coûte rien à la récupération et ne réduit pas encore les portions."});
      } else {
        out.push({type:"alerte", t:"Perte trop rapide — "+txt, kcal:200,
          x:"Au-delà de "+Math.abs(bas)+" g par semaine, une part importante de ce que tu perds est du muscle, pas du gras. Remonte de 200 kcal par jour. Une perte plus lente donne un meilleur résultat final et se tient beaucoup plus longtemps."});
      }
    }
  }

  /* --- Force : le vrai indicateur pendant une sèche --- */
  const tf = tendanceForce();
  if(tf !== null){
    if(o.signe < 0 && tf < -0.07){
      out.push({type:"alerte", t:"Tes performances baissent",
        x:"Tes charges et répétitions ont reculé d'environ "+Math.round(Math.abs(tf)*100)+" % sur quinze jours. Pendant une perte de gras, c'est le signal le plus fiable d'une perte de muscle. Trois corrections, dans cet ordre : monte les protéines à "+Math.round(p*2.2)+" g par jour, réduis le déficit d'un cran, et vérifie ton sommeil. Garde les charges, réduis le nombre de séries."});
    } else if(tf > 0.05){
      out.push({type:"ok", t:"Tes performances montent",
        x:"Environ "+Math.round(tf*100)+" % de mieux sur quinze jours. "+(o.signe < 0
          ? "Progresser en force pendant une perte de gras est le meilleur signe possible : tu perds du gras, pas du muscle."
          : "Le stimulus est bien calibré et la récupération suit.")+" Ne change rien."});
    }
  }

  /* --- Mensurations --- */
  const dates = Object.keys(E.mensurations).sort();
  if(dates.length >= 2){
    const av = E.mensurations[dates[0]], ap = E.mensurations[dates[dates.length-1]];
    if(av.taille && ap.taille && av.bras && ap.bras){
      const dT = ap.taille - av.taille, dB = ap.bras - av.bras;
      if(o.signe > 0 && dT >= 3 && dB <= 0.5){
        out.push({type:"action", t:"Le gain part surtout en gras", kcal:-200,
          x:"Ton tour de taille a pris "+dT.toFixed(1)+" cm pendant que ton tour de bras prenait "+dB.toFixed(1)+" cm. La répartition n'est pas bonne. Réduis le surplus de 200 kcal et assure-toi d'atteindre tes protéines chaque jour."});
      } else if(o.signe < 0 && dT <= -2){
        out.push({type:"ok", t:"Tour de taille en baisse",
          x:"Moins "+Math.abs(dT).toFixed(1)+" cm au nombril. C'est la mesure la plus corrélée à la perte de graisse viscérale, bien devant le chiffre de la balance."});
      } else if(dB >= 1.5){
        out.push({type:"ok", t:"Bonne répartition du gain",
          x:"Tour de bras "+(dB>=0?"+":"")+dB.toFixed(1)+" cm, tour de taille "+(dT>=0?"+":"")+dT.toFixed(1)+" cm. C'est le rapport recherché."});
      }
    }
  }

  /* --- Cycle menstruel --- */
  if(E.profil.sexe === "f" && maAvant !== null){
    const brut = Object.keys(E.poids).sort().slice(-14).map(k=>E.poids[k]);
    if(brut.length >= 10){
      const amplitude = Math.max(...brut) - Math.min(...brut);
      if(amplitude > p*0.02){
        out.push({type:"info", t:"Fortes variations de poids",
          x:"Ton poids a varié de "+amplitude.toFixed(1)+" kg sur quatorze jours. Sur un cycle menstruel, la rétention d'eau produit couramment ce genre d'amplitude sans le moindre rapport avec la graisse. Compare plutôt une semaine à la même semaine du cycle précédent, et ne corrige jamais tes calories sur une variation soudaine."});
      }
    }
  }

  /* --- Activité chiffrée --- */
  if(a14.heuresLivr >= 20){
    out.push({type:"info", t:a14.heuresLivr+" h d'activité en quatorze jours",
      x:"Cette dépense est déjà ajoutée automatiquement à ta cible les jours concernés. Deux points d'attention : évite de placer une séance de jambes le jour d'une activité longue, et prépare tes repas à l'avance — plusieurs heures d'effort sans manger, ce sont des centaines de calories qui ne seront jamais rattrapées."});
  }

  /* --- Cardio --- */
  const card = CARDIO[E.profil.objectif] || CARDIO.maintien;
  if(card.min >= 90 && sem >= 3){
    out.push({type:"info", t:"Cardio : "+card.min+" à "+card.max+" min par semaine",
      x:card.d});
  }

  if(!out.length){
    out.push({type:"ok", t:"Rien à signaler",
      x:"Aucun signal négatif sur les quatorze derniers jours. Continue exactement pareil."});
  }
  return out;
}

/* ============================================================
   LISTE DE COURSES — agrégée depuis le menu de la semaine
   ============================================================ */
const JOURS_MENU = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const MOMENTS = ["matin","midi","soir","shake","collation"];

function listeCourses(){
  const total = {};
  JOURS_MENU.forEach(j=>{
    const m = E.menu[j] || {};
    MOMENTS.forEach(mo=>{
      const id = m[mo]; if(!id) return;
      const r = trouverRecette(id); if(!r) return;
      (r.ing||[]).forEach(([ai,gr])=>{ total[ai] = (total[ai]||0) + gr; });
    });
  });
  const parRayon = {};
  Object.entries(total).forEach(([ai,gr])=>{
    const a = AL(ai); if(!a) return;
    (parRayon[a.r] = parRayon[a.r] || []).push({
      id:ai, nom:a.n, g:Math.round(gr), cout:Math.round(a.prix*gr/1000*100)/100
    });
  });
  Object.values(parRayon).forEach(l=>l.sort((x,y)=>y.cout-x.cout));
  const budget = Object.values(parRayon).flat().reduce((s,i)=>s+i.cout,0);
  return {parRayon, budget:Math.round(budget*100)/100};
}
function menuKcalJour(j){
  const m = E.menu[j]||{}; let k=0;
  MOMENTS.forEach(mo=>{ const r = m[mo] && trouverRecette(m[mo]); if(r) k += macrosRecette(r).kcal; });
  return k;
}


/* ============================================================
   PACKS — fiches recettes / exercices / aliments générées par
   une IA, importées et AJOUTÉES à l'existant.
   ============================================================ */
const MOMENTS_VALIDES = ["matin","midi","soir","shake","collation"];
const RAYONS = ["Épicerie","Frais","Boucherie","Conserves","Fruits & légumes","Surgelés","Compléments"];

function slug(txt){
  return "x" + String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,18) + Math.random().toString(36).slice(2,5);
}
function nettoyerJSON(txt){
  let t = String(txt).trim();
  t = t.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  const d = t.indexOf("{"), f = t.lastIndexOf("}");
  if(d > 0 || (f > -1 && f < t.length-1)) t = t.slice(d, f+1);
  return t;
}

/* Analyse un pack sans rien modifier. Retourne un rapport. */
function analyserPack(txt){
  const rap = {ok:false, nom:"", aliments:[], exercices:[], recettes:[], erreurs:[], doublons:[]};
  let d;
  try{ d = JSON.parse(nettoyerJSON(txt)); }
  catch(e){ rap.erreurs.push("Le texte n'est pas du JSON valide. Vérifie qu'il n'y a ni virgule en trop, ni texte autour."); return rap; }
  if(!d || typeof d !== "object" || Array.isArray(d)){
    rap.erreurs.push("Le fichier doit être un objet contenant les clés recettes, exercices ou aliments."); return rap; }
  if(d.profil && !d.recettes && !d.exercices){
    rap.erreurs.push("Ce fichier est une SAUVEGARDE complète, pas un pack. Utilise le bouton Restaurer une sauvegarde."); return rap; }
  rap.nom = String(d.pack || d.nom || "Pack sans nom").slice(0,60);

  const noms = {
    al: Object.keys(tousAliments()).map(k=>tousAliments()[k].n.toLowerCase()),
    ex: Object.keys(tousExos()).map(k=>tousExos()[k].n.toLowerCase()),
    re: toutesRecettes().map(r=>r.n.toLowerCase())
  };
  const dispo = tousAliments();   // les aliments du pack s'ajouteront au fur et à mesure

  /* --- Aliments --- */
  (d.aliments||[]).forEach((a,i)=>{
    const ou = "Aliment " + (a && a.n ? "« "+a.n+" »" : "n°"+(i+1));
    if(!a || !a.n){ rap.erreurs.push(ou+" : nom manquant."); return; }
    const id = a.id && /^[a-zA-Z][a-zA-Z0-9]*$/.test(a.id) ? a.id : slug(a.n);
    const nb = ["k","p","g","l","prix"].filter(c => typeof a[c] !== "number" || a[c] < 0);
    if(nb.length){ rap.erreurs.push(ou+" : valeurs manquantes ou négatives ("+nb.join(", ")+")."); return; }
    if(a.k > 950){ rap.erreurs.push(ou+" : "+a.k+" kcal/100 g est impossible (maximum 900, l'huile pure)."); return; }
    if(noms.al.indexOf(a.n.toLowerCase()) > -1){ rap.doublons.push(ou+" existe déjà, ignoré."); return; }
    const r = RAYONS.indexOf(a.r) > -1 ? a.r : "Épicerie";
    const obj = {n:String(a.n).slice(0,44), r, k:+a.k, p:+a.p, g:+a.g, l:+a.l, prix:+a.prix};
    dispo[id] = obj;
    rap.aliments.push([id, obj]);
  });

  /* --- Exercices --- */
  (d.exercices||[]).forEach((x,i)=>{
    const ou = "Exercice " + (x && x.n ? "« "+x.n+" »" : "n°"+(i+1));
    if(!x || !x.n){ rap.erreurs.push(ou+" : nom manquant."); return; }
    if(!PATRONS[x.pat]){ rap.erreurs.push(ou+" : patron « "+x.pat+" » inconnu. Valeurs acceptées : "+Object.keys(PATRONS).join(", ")+"."); return; }
    if(!Array.isArray(x.exec) || x.exec.length < 2){ rap.erreurs.push(ou+" : il faut au moins 2 étapes d'exécution."); return; }
    if(!Array.isArray(x.err) || x.err.length < 1){ rap.erreurs.push(ou+" : il faut au moins 1 erreur fréquente."); return; }
    if(x.fig && !FIGURES[x.fig]){ rap.erreurs.push(ou+" : figure « "+x.fig+" » inconnue. Laisse le champ vide ou choisis parmi : "+Object.keys(FIGURES).join(", ")+"."); return; }
    if(noms.ex.indexOf(x.n.toLowerCase()) > -1){ rap.doublons.push(ou+" existe déjà, ignoré."); return; }
    const id = slug(x.n);
    rap.exercices.push([id, {
      n:String(x.n).slice(0,48), pat:x.pat,
      niv: [1,2,3].indexOf(x.niv) > -1 ? x.niv : 2,
      repos: typeof x.repos === "number" ? Math.min(300, Math.max(30, x.repos)) : 120,
      tempo: x.tempo || "3-1-X",
      mus: Array.isArray(x.mus) ? x.mus.slice(0,5).map(String) : [],
      mat: Array.isArray(x.mat) ? x.mat.slice(0,4).map(String) : [],
      exec: x.exec.slice(0,7).map(String), err: x.err.slice(0,5).map(String),
      note: x.note ? String(x.note) : undefined,
      fig: x.fig || undefined, uni: !!x.uni, lest: !!x.lest, perso:true
    }]);
  });

  /* --- Recettes --- */
  (d.recettes||[]).forEach((r,i)=>{
    const ou = "Recette " + (r && r.n ? "« "+r.n+" »" : "n°"+(i+1));
    if(!r || !r.n){ rap.erreurs.push(ou+" : nom manquant."); return; }
    if(MOMENTS_VALIDES.indexOf(r.m) < 0){ rap.erreurs.push(ou+" : moment « "+r.m+" » inconnu. Valeurs acceptées : "+MOMENTS_VALIDES.join(", ")+"."); return; }
    if(!Array.isArray(r.ing) || !r.ing.length){ rap.erreurs.push(ou+" : aucun ingrédient."); return; }
    const inconnus = [], ing = [];
    r.ing.forEach(pair=>{
      if(!Array.isArray(pair) || pair.length < 2) return;
      const [ai, gr] = pair;
      if(!dispo[ai]){ inconnus.push(ai); return; }
      if(typeof gr !== "number" || gr <= 0 || gr > 2000) return;
      ing.push([ai, Math.round(gr)]);
    });
    if(inconnus.length){ rap.erreurs.push(ou+" : ingrédient(s) inconnu(s) — "+inconnus.join(", ")+". Utilise un identifiant de la liste, ou ajoute-le dans la section aliments du pack."); return; }
    if(!ing.length){ rap.erreurs.push(ou+" : aucun ingrédient exploitable."); return; }
    if(!Array.isArray(r.et) || !r.et.length){ rap.erreurs.push(ou+" : aucune étape de préparation."); return; }
    if(noms.re.indexOf(r.n.toLowerCase()) > -1){ rap.doublons.push(ou+" existe déjà, ignorée."); return; }
    const obj = {
      id: slug(r.n), n:String(r.n).slice(0,48), m:r.m,
      t: typeof r.t === "number" ? Math.min(180, Math.max(1, r.t)) : 15,
      mix: !!r.mix, ing, et: r.et.slice(0,10).map(String),
      as: r.as ? String(r.as) : undefined, perso:true
    };
    const mm = {k:0}; ing.forEach(([ai,g])=>{ mm.k += dispo[ai].k*g/100; });
    obj._kcal = Math.round(mm.k);
    if(obj._kcal < 60){ rap.erreurs.push(ou+" : seulement "+obj._kcal+" kcal, les grammages semblent erronés."); return; }
    rap.recettes.push(obj);
  });

  rap.total = rap.aliments.length + rap.exercices.length + rap.recettes.length;
  rap.ok = rap.total > 0;
  if(!rap.ok && !rap.erreurs.length && !rap.doublons.length)
    rap.erreurs.push("Le pack ne contient aucune recette, aucun exercice et aucun aliment.");
  return rap;
}

/* Applique un rapport validé : tout est AJOUTÉ, rien n'est écrasé. */
function appliquerPack(rap){
  E.alimentsPerso = E.alimentsPerso || {};
  E.exosPerso     = E.exosPerso || {};
  E.recettesPerso = E.recettesPerso || [];
  rap.aliments.forEach(([id,o]) => { E.alimentsPerso[id] = o; });
  rap.exercices.forEach(([id,o]) => { E.exosPerso[id] = o; });
  rap.recettes.forEach(o => { delete o._kcal; E.recettesPerso.push(o); });
  sauver();
  return rap.total;
}

/* ============================================================
   ASSEMBLAGE
   Réunit les quatre familles d'exercices, branche l'équipement
   sur les machines cochées et remplace l'ancien rendu 2D par
   le moteur 3D, sans toucher aux points d'appel de l'interface.
   ============================================================ */

[EXOS_POUSSER, EXOS_TIRER, EXOS_JAMBES, EXOS_BRAS_TRONC].forEach(groupe=>{
  Object.keys(groupe).forEach(k => { EXOS[k] = groupe[k]; });
});

/* Valeurs par défaut et contrôle d'intégrité */
Object.keys(EXOS).forEach(k=>{
  const x = EXOS[k];
  if(!Array.isArray(x.eq))  x.eq = [];
  if(!Array.isArray(x.mus)) x.mus = [];
  if(!x.niv)   x.niv = 1;
  if(!x.repos) x.repos = x.pat === "cardio" ? 0 : 90;
  if(!x.tempo) x.tempo = "2-1-2";
  if(!x.zone)  x.zone = (PATRONS[x.pat] || {n:""}).n;
  /* Les anciens champs restent alimentés pour l'interface existante */
  x.exec  = x.exec || [];
  x.err   = x.pasFaire || [];
  x.mat   = x.eq.map(m => (MACHINES[m] || {n:m}).n);
});

/* ------------------------------------------------------------
   FIGURES — le moteur 3D remplace l'ancien rendu.
   On redéfinit les trois fonctions appelées par l'interface,
   ce qui évite de reprendre tous les points d'appel.
   ------------------------------------------------------------ */
const FIG_EXO = {};
Object.keys(EXOS).forEach(k => { if(EXOS[k].fig) FIG_EXO[k] = EXOS[k].fig; });

function figDe(exoId){
  const x = EX(exoId);
  return !!(x && x.fig && FIG3D[x.fig]);
}
function figureSVG(exoId, anim){
  const x = EX(exoId);
  if(!x || !x.fig || !FIG3D[x.fig]) return "";
  return cadre3D(x.fig, {mini: !anim, h: anim ? 210 : 92, w: anim ? 300 : 130});
}
function animerFigures(){ animer3D(); }

/* ------------------------------------------------------------
   ÉQUIPEMENT — piloté par les machines cochées
   ------------------------------------------------------------ */
function machinesActives(){
  const m = E.profil.machines;
  return Array.isArray(m) && m.length ? m : machinesParDefaut();
}
function materielDispo(){ return machinesActives(); }

function exoDispo(id){
  const x = EX(id); if(!x) return false;
  const dispo = machinesActives();
  return (x.eq || []).every(e => dispo.indexOf(e) > -1);
}
/* Un exercice indisponible peut parfois se faire sur une machine équivalente */
function remplacantMachine(id){
  const x = EX(id); if(!x) return null;
  const dispo = machinesActives();
  const manquantes = (x.eq||[]).filter(e => dispo.indexOf(e) < 0);
  if(!manquantes.length) return null;
  for(const m of manquantes){
    const alt = (EQUIVALENTS[m] || []).find(a => dispo.indexOf(a) > -1);
    if(alt) return {manque:m, parQuoi:alt};
  }
  return {manque:manquantes[0], parQuoi:null};
}

/* Un exercice « chargeable » accepte une charge réglable au kilo près */
function chargeable(id){
  const x = EX(id); if(!x) return false;
  const libres = ["halteres","barreOlymp","barreEz","cageSquat","smith","kettlebell"];
  const guidees = Object.keys(MACHINES).filter(m => ["pousser","tirer","jambes","bras","tronc","poulies"].indexOf(MACHINES[m].z) > -1);
  return (x.eq||[]).some(e => libres.indexOf(e) > -1 || guidees.indexOf(e) > -1);
}

/* ------------------------------------------------------------
   Vivier d'exercices pour un patron donné.
   En force, on travaille en séries de deux à cinq répétitions :
   seuls les mouvements polyarticulaires de base y ont leur place.
   ------------------------------------------------------------ */
function poolPatron(pat, nivMax){
  const T = tousExos();
  let l = Object.keys(T)
    .filter(id => T[id].pat === pat && exoDispo(id) && (T[id].niv || 2) <= nivMax);
  if(E.profil.objectif === "force" && pat !== "gainage" && pat !== "cardio" && pat !== "bras"){
    const socle = l.filter(id => T[id].base);
    if(socle.length) l = socle;
    else { const ch = l.filter(chargeable); if(ch.length) l = ch; }
  }
  return l.sort((a,b) => (T[a].niv||2) - (T[b].niv||2) || a.localeCompare(b));
}

/* ------------------------------------------------------------
   Couverture : quels patrons de mouvement les machines cochées
   permettent-elles réellement de travailler ?
   ------------------------------------------------------------ */
function couverturePatrons(){
  const out = {};
  Object.keys(PATRONS).forEach(p=>{
    out[p] = Object.keys(tousExos()).filter(id => tousExos()[id].pat === p && exoDispo(id)).length;
  });
  return out;
}
function patronsDecouverts(){
  const c = couverturePatrons();
  return Object.keys(c).filter(p => c[p] === 0 && p !== "cardio");
}

/* ============================================================
   LA BARRE — signature : 52 semaines empilées
   ============================================================ */
function etatSemaine(s){
  const semNow = numSemaine();
  if(s > semNow) return "futur";
  const debut = dPlus(E.profil.dateDebut, (s-1)*7);
  let prevues=0, faites=0, joursOk=0, joursSuivis=0;
  for(let i=0;i<7;i++){
    const d = dPlus(debut,i);
    if(seancePrevue(d)){ prevues++; if(seanceFaite(d)) faites++; }
    if((E.repas[d]||[]).length){ joursSuivis++; if(kcalJour(d) >= cibleKcal(d)*0.9) joursOk++; }
  }
  if(!prevues && !joursSuivis) return "vide";
  const tS = prevues ? faites/prevues : 1;
  const tR = joursSuivis ? joursOk/Math.max(joursSuivis,5) : 0;
  const score = (tS + tR)/2;
  if(estDeload(s)) return score >= .5 ? "deload" : "vide";
  if(score >= .75) return "plein";
  if(score >= .3)  return "partiel";
  return "vide";
}
function largeurSemaine(s){
  const dep = E.profil.poidsDepart;
  const obj = dep + 11;
  const debut = dPlus(E.profil.dateDebut, (s-1)*7 + 6);
  let p = null;
  for(let i=0;i<7 && p===null;i++) p = moyenneMobile(dPlus(debut,-i), 7);
  if(p === null) return 22;
  return Math.max(22, Math.min(100, 22 + (p - dep)/(obj - dep)*78));
}
function barreAn(){
  const semNow = numSemaine();
  let h = "";
  for(let s=1;s<=52;s++){
    h += `<div class="sem ${etatSemaine(s)} ${s===semNow?"now":""}" style="width:${largeurSemaine(s)}%" title="Semaine ${s}"></div>`;
  }
  return h;
}
function barreCompacte(){
  const semNow = numSemaine();
  let h = "";
  for(let s=1;s<=52;s++){
    const e = etatSemaine(s);
    const col = {plein:"linear-gradient(180deg,var(--vrt-2),var(--vrt-4))",
                 partiel:"linear-gradient(180deg,var(--amb-2),var(--amb-4))",
                 deload:"linear-gradient(180deg,var(--blu-2),var(--blu-4))",
                 vide:"var(--nuit-3)", futur:"var(--nuit-2)"}[e];
    const ht = e==="futur" ? 20 : Math.max(24, largeurSemaine(s));
    h += `<i style="height:${ht}%;background:${col};${s===semNow?"box-shadow:0 0 8px var(--amb-o);outline:1px solid var(--amb-3)":""}"></i>`;
  }
  return h;
}

  /* Feuille de route */
  h += `<div class="carte"><div class="eyebrow" style="margin-bottom:11px">Les 5 blocs de l'année</div>`;
  BLOCS.forEach(b=>{
    const actif = b.id === bloc.id, passe = sem > b.s[1];
    h += `<div class="ligne" onclick="ouvrirBloc(${b.id})">
      <div class="puce ${actif?"amber":passe?"green":"blue"}">${passe?"✓":b.id}</div>

      <span class="t3">›</span></div>`;

  h += `</div>`;

  /* Galerie des mouvements */
  h += `<div class="carte">
    <div class="carte-tete">
      <div><div class="eyebrow">Bibliothèque</div><h3 style="margin-top:5px">Tous les mouvements</h3></div>
      <span class="pillule gris">${Object.keys(tousExos()).length}</span>

  </div>`;

  /* Imprévus */
  h += `<div class="carte rose">
